# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/icloud-photos-downloader/icloud_photos_downloader"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: ICLOUDPD_EXTRA_ARGS
    default: ""
    required: false
  - name: ICLOUDPD_MFA_PROVIDER
    default: "webui"
    required: false
  - name: ICLOUDPD_PASSWORD_PROVIDER
    default: "webui"
    required: false
  - name: ICLOUDPD_USERNAME
    default: ""
    required: false
  - name: ICLOUDPD_WATCH_INTERVAL
    default: "3600"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /data
    required: false
