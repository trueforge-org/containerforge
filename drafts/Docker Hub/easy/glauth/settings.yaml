# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/glauth/glauth"
# LDAP on 3893 and the REST API on 5555 are open in the seed config. LDAPS (3894) is off by default and not listed.
ports:
  - port: 3893
    protocol: tcp
    required: true
  - port: 5555
    protocol: tcp
    required: false
env:
  # Read by start.sh, not by glauth.
  - name: CONFIGFILE
    default: "/config/glauth.cfg"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
