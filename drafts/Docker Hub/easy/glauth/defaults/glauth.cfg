# Minimal seed config. Copied to /config/glauth.cfg on first start only.
# It has no users on purpose: add [[users]] entries before expecting any login.
# UNVERIFIED for this tag: whether glauth starts with zero users, and whether the key names below match v2.5.5.
# Groups use unixid (upstream sample style). The plan said gidnumber.

debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  # Needs a certificate and key in /config before it can be enabled. Plain LDAP sends credentials in clear text.
  enabled = false
  listen = "0.0.0.0:3894"
  cert = "/config/glauth.crt"
  key = "/config/glauth.key"

[backend]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"

[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = true
  NumberOfFailedBinds = 3
  PeriodOfFailedBinds = 10
  BlockFailedBindsFor = 60
  PruneSourceTableEvery = 600
  PruneSourcesOlderThan = 600

[[groups]]
  name = "superheros"
  unixid = 5501

[api]
  # UNVERIFIED: the REST API is unauthenticated and has no TLS by default. Consider defaulting this to false.
  enabled = true
  tls = false
  listen = "0.0.0.0:5555"
  cert = "/config/glauth.crt"
  key = "/config/glauth.key"
