# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/xmrig/xmrig"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: XMRIG_URL
    default: ""
    required: false
  - name: XMRIG_USER
    default: ""
    required: false
  - name: XMRIG_PASS
    default: "x"
    required: false
  - name: XMRIG_RIG_ID
    default: ""
    required: false
  - name: XMRIG_TLS
    default: ""
    required: false
  - name: XMRIG_DONATE_LEVEL
    default: "1"
    required: false
  - name: XMRIG_THREADS
    default: ""
    required: false
  - name: XMRIG_HUGE_PAGES
    default: "true"
    required: false
  - name: XMRIG_HTTP_PORT
    default: "8080"
    required: false
  - name: XMRIG_HTTP_ACCESS_TOKEN
    default: ""
    required: false
volumes:
  - path: /config
    required: false
