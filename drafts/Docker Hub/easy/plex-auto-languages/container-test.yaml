# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

# The app idles until it is configured (PLEX_URL or /config/config.yaml), and this
# test sets no env, so port 9880 is not open here. The checks are runner output
# checks, as in apps/jbops: the Python dependency imports and the app is present.
# TODO: add a tcp probe on 9880 once a configured start can be tested.
runners:
- entrypoint: /usr/local/bin/python
  cmd: "-c __import__('plexapi');print('plexapi'+'-ok')"
  expectedOutput: plexapi-ok
- entrypoint: /usr/local/bin/python
  cmd: "-c print('pal'+'-ok'*__import__('os').path.isfile('/app/plex-auto-languages/main.py'))"
  expectedOutput: pal-ok

mainRunner:
  enabled: false
