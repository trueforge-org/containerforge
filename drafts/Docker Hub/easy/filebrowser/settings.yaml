# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/filebrowser/filebrowser"
# Upstream is archived; see docker-bake.hcl. Port 8080 replaces upstream's 80 for non-root use.
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: FB_ADDRESS
    default: "0.0.0.0"
    required: false
  - name: FB_PORT
    default: "8080"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /data
    required: false
