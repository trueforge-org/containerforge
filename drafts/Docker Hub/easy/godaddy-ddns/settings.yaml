# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/jwater7/docker-godaddy-publicip-updater"
ports:
  []
env:
  - name: GODADDY_API_KEY
    default: ""
    required: true
  - name: GODADDY_API_SECRET
    default: ""
    required: true
  - name: GODADDY_DOMAINS
    default: ""
    required: true
  - name: GODADDY_A_NAMES
    default: "@"
    required: false
  - name: UPDATE_INTERVAL_SEC
    default: "900"
    required: false
  - name: GET_IP_WAIT_SEC
    default: "10"
    required: false
  - name: UPDATER_CONFIG_FILE
    default: "/config/config.json"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
