server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Generated page, written to /tmp/html by docker-entrypoint.d/80-index.sh
    location = / {
        root /tmp/html;
        try_files /index.html =404;
    }

    # Baked-in video, read-only in the image
    location = /video.mp4 {
        root /usr/share/nginx/html;
    }

    location / {
        return 302 /;
    }
}
