# Main nginx config for the rootless image. Only /tmp and /dev/std* are writable.
# The site fragment rendered by start.sh is included inside http.
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # the default access log path is under /var/log, which is not writable here
  access_log /dev/stdout;

  include /etc/nginx/mime.types;
  include /tmp/dispatcharr-site.conf;
}
