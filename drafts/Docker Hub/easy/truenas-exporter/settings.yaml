# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/prometheus/graphite_exporter"
ports:
  - port: 9108
    protocol: tcp
    required: false
  - port: 9109
    protocol: tcp
    required: false
  - port: 9109
    protocol: udp
    required: false
env:
  - name: GRAPHITE_MAPPING_CONFIG
    default: "/config/graphite_mapping.conf"
    required: false
  - name: EXPORTER_ARGS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
