# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/apache/guacamole-server"
ports:
  - port: 4822
    protocol: tcp
    required: true
env:
  - name: GUACD_LOG_LEVEL
    default: ""
    required: false
  - name: LOG_LEVEL
    default: "info"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
  - path: /var/lib/guacamole/recordings
    required: false
  - path: /var/lib/guacamole/drive
    required: false
dependencies: []
