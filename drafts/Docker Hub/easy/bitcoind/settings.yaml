# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/bitcoin/bitcoin"
ports:
  - port: 8333
    protocol: tcp
    required: false
  - port: 8332
    protocol: tcp
    required: false
env:
  # Read by start.sh only. Empty means JSON-RPC listens on localhost only.
  - name: BITCOIN_RPCALLOWIP
    default: ""
    required: false
  # rpcauth string (salted hash from share/rpcauth/rpcauth.py), not a password.
  - name: BITCOIN_RPCAUTH
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
