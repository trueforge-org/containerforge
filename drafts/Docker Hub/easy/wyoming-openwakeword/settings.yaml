# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/rhasspy/wyoming-openwakeword"
ports:
  - port: 10400
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: OWW_THRESHOLD
    default: "0.5"
    required: false
  - name: OWW_TRIGGER_LEVEL
    default: "1"
    required: false
  - name: OWW_REFRACTORY_SECONDS
    default: "2"
    required: false
  - name: OWW_CUSTOM_MODEL_DIR
    default: "/config/custom"
    required: false
  - name: OWW_DEBUG
    default: ""
    required: false
volumes:
  - path: /config
    required: false
