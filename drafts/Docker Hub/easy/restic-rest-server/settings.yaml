# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/restic/rest-server"
ports:
  - port: 8000
    protocol: tcp
    required: false
env:
  - name: DATA_DIRECTORY
    default: "/config/data"
    required: false
  - name: DISABLE_AUTHENTICATION
    default: ""
    required: false
  - name: OPTIONS
    default: ""
    required: false
  - name: PASSWORD_FILE
    default: "/config/.htpasswd"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
