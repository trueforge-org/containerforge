# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ninthwalker/slack-invite"
ports:
  - port: 7879
    protocol: tcp
    required: true
env:
  - name: PORT
    default: "7879"
    required: false
  - name: COMMUNITY_NAME
    default: "YOUR-TEAM-NAME"
    required: false
  - name: SLACK_URL
    default: "YOUR-TEAM.slack.com"
    required: false
  - name: SLACK_TOKEN
    default: "YOUR-ACCESS-TOKEN"
    required: false
  - name: INVITE_TOKEN
    default: ""
    required: false
  - name: LOCALE
    default: "en"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
dependencies: []
