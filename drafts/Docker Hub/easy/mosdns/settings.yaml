# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/IrineSistiana/mosdns"
ports:
  - port: 5353
    protocol: tcp
    required: false
  - port: 5353
    protocol: udp
    required: false
env:
  # read by start.sh only, to render the first-run config; later changes do not touch an existing /config/config.yaml
  - name: MOSDNS_PORT
    default: "5353"
    required: false
  # default copied from the upstream wiki example; confirm it is the desired default
  - name: MOSDNS_UPSTREAM
    default: "https://8.8.8.8/dns-query"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
