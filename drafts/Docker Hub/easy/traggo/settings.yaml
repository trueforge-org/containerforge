# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/traggo/server"
ports:
  - port: 3030
    protocol: tcp
    required: true
env:
  - name: TRAGGO_PORT
    default: "3030"
    required: false
  - name: TRAGGO_LOG_LEVEL
    default: "info"
    required: false
  - name: TRAGGO_DEFAULT_USER_NAME
    default: "admin"
    required: false
  - name: TRAGGO_DEFAULT_USER_PASS
    default: "admin"
    required: false
  - name: TRAGGO_PASS_STRENGTH
    default: "10"
    required: false
  - name: TRAGGO_DATABASE_CONNECTION
    default: "/config/traggo.db"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
