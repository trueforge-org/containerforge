# Seeded to /config/guacamole/guacamole.properties on first start. Existing files are never overwritten.
# guacd is the native proxy for RDP/VNC/SSH. Port 4822 is the default from the Apache docs.
# UNVERIFIED: the guacd hostname depends on how the guacd service is named in your deployment.
guacd-hostname: guacd
guacd-port: 4822
