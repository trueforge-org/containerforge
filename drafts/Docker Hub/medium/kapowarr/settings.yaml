# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Casvt/Kapowarr"
ports:
  - port: 5656
    protocol: tcp
    required: false
env:
  # Only TZ is listed: no other env var was verified in the source (plan section 6).
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
