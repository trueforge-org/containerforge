# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/kutzilla/docker-hetzner-ddns"
ports: []
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: ZONE_NAME
    default: ""
    required: true
  - name: API_TOKEN
    default: ""
    required: true
  - name: RECORD_TYPE
    default: "A"
    required: false
  - name: RECORD_NAME
    default: "@"
    required: false
  - name: TTL
    default: "86400"
    required: false
  - name: CRON_EXPRESSION
    default: "*/5 * * * *"
    required: false
volumes:
  - path: /config
    required: false
