# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/cglatot/pasta"
ports:
  - port: 3000
    protocol: tcp
    required: true
env:
  - name: PORT
    default: "3000"
    required: false
  - name: PASTA_MODE
    default: "server"
    required: false
  - name: PASTA_CONFIG_DIR
    default: "/config"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
