# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/muety/mininote"
ports:
  # UNVERIFIED: 3000 comes from the upstream README Docker example, not from source
  - port: 3000
    protocol: tcp
    required: false
env:
  - name: HTTPS_CERT
    default: ""
    required: false
  - name: HTTPS_KEY
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
