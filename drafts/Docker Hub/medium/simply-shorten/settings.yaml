# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://gitlab.com/draganczukp/simply-shorten"
ports:
  - port: 4567
    protocol: tcp
    required: true
# UNVERIFIED: app env vars (storage path, bind address) not yet read from source.
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
