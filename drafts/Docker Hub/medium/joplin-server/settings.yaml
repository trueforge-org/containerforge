# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/laurent22/joplin"
ports:
  - port: 22300
    protocol: tcp
    required: false
env:
  # UNVERIFIED: database (DB_CLIENT, POSTGRES_*) and mail (MAILER_*) variables are not listed until read from the server source.
  - name: APP_PORT
    default: "22300"
    required: false
  - name: NODE_ENV
    default: "production"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
