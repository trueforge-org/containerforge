# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/coreruleset/modsecurity-crs-docker"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "8080"
    required: false
  - name: SERVER_NAME
    default: "localhost"
    required: false
  - name: BACKEND
    default: "http://localhost:80"
    required: false
  - name: MODSEC_RULE_ENGINE
    default: "on"
    required: false
  - name: PARANOIA
    default: "1"
    required: false
  - name: BLOCKING_PARANOIA
    default: "1"
    required: false
  - name: ANOMALY_INBOUND
    default: "5"
    required: false
  - name: ANOMALY_OUTBOUND
    default: "4"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
