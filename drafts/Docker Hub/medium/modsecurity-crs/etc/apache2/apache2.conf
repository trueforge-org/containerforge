# Rootless Apache config for the ContainerForge image.
# Replaces the packaged /etc/apache2/apache2.conf. start.sh writes /tmp/apache2/rendered.conf
# (port, backend, CRS settings) at each start.
ServerRoot "/etc/apache2"

PidFile /tmp/apache2/apache2.pid
Mutex file:/tmp/apache2 default
DefaultRuntimeDir /tmp/apache2

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

ServerTokens Prod
ServerSignature Off
Timeout 60
KeepAlive On
KeepAliveTimeout 5
HostnameLookups Off
TypesConfig /etc/mime.types
DefaultType text/plain

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Forward proxy access is never needed; reverse proxying is set in rendered.conf
ProxyRequests Off
<Proxy "*">
    Require all granted
</Proxy>

# UNVERIFIED: module paths on Ubuntu 26.04
LoadModule unixd_module /usr/lib/apache2/modules/mod_unixd.so
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule log_config_module /usr/lib/apache2/modules/mod_log_config.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule unique_id_module /usr/lib/apache2/modules/mod_unique_id.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule security2_module /usr/lib/apache2/modules/mod_security2.so

Include /app/modsecurity/modsecurity.conf
Include /tmp/apache2/rendered.conf
