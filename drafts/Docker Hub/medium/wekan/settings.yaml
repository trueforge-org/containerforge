# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/wekan/wekan"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "8080"
    required: false
  # Meteor reads ROOT_URL; the chart sets it. UNVERIFIED for this bundle.
  - name: ROOT_URL
    default: "http://localhost:8080"
    required: false
  # Required at runtime when WEKAN_DB=mongodb. Read by wekan-entrypoint.sh (or MONGO_URL_FILE).
  - name: MONGO_URL
    default: ""
    required: false
  # UNVERIFIED: selects the database backend (mongodb or ferretdb) in the entrypoint.
  - name: WEKAN_DB
    default: "mongodb"
    required: false
  - name: WRITABLE_PATH
    default: "/config/data"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: mongodb
