# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/XanderStrike/goplaxt"
ports:
  - port: 8000
    protocol: tcp
    required: false
# UNVERIFIED: Trakt client ID, client secret and redirect URL env names are not yet read from source.
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
