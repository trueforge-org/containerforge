# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/DIYgod/RSSHub"
ports:
  - port: 1200
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: PORT
    default: "1200"
    required: false
  - name: CACHE_TYPE
    default: "memory"
    required: false
  # Empty by default. start.sh fills it when a system Chromium is present.
  - name: CHROMIUM_EXECUTABLE_PATH
    default: ""
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
opt_dependencies:
  - name: valkey
