# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/allinurl/goaccess"
ports:
  - port: 7889
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  # read-only input mount provided by the user (web server access logs)
  - path: /opt/log
    required: false
dependencies: []
