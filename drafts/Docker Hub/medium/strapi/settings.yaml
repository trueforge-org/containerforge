# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/strapi/strapi"
ports:
  - port: 1337
    protocol: tcp
    required: false
env:
  - name: NODE_ENV
    default: "production"
    required: false
  - name: HOST
    default: "0.0.0.0"
    required: false
  - name: PORT
    default: "1337"
    required: false
  - name: DATABASE_CLIENT
    default: "sqlite"
    required: false
  - name: DATABASE_HOST
    default: ""
    required: false
  - name: DATABASE_PORT
    default: "5432"
    required: false
  - name: DATABASE_NAME
    default: "strapi"
    required: false
  - name: DATABASE_USERNAME
    default: "strapi"
    required: false
  - name: DATABASE_PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
# PostgreSQL is optional: SQLite is the default
opt_dependencies:
  - name: postgresql
