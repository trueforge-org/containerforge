# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ekzhang/rustpad"
ports:
  - port: 3030
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "3030"
    required: false
  - name: EXPIRY_DAYS
    default: "1"
    required: false
  - name: SQLITE_URI
    default: "sqlite:///config/rustpad_db.db"
    required: false
  - name: RUST_LOG
    default: "info"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
