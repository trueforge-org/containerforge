# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/AeonLucid/Impostor"
ports:
  - port: 22023
    protocol: tcp
    required: true
  - port: 22023
    protocol: udp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  # IMPOSTOR_* names are read by ASP.NET configuration (IMPOSTOR_Section__Key), not by start.sh.
  - name: IMPOSTOR_Server__PublicIp
    default: "127.0.0.1"
    required: false
  - name: IMPOSTOR_Server__PublicPort
    default: "22023"
    required: false
  - name: IMPOSTOR_Server__ListenIp
    default: "0.0.0.0"
    required: false
  - name: IMPOSTOR_Server__ListenPort
    default: "22023"
    required: false
  - name: IMPOSTOR_AntiCheat__Enabled
    default: "true"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
