# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/grafana/grafana"
ports:
  - port: 3000
    protocol: tcp
    required: true
env:
  - name: GF_SECURITY_ADMIN_PASSWORD
    # UNVERIFIED variable name; confirm in Grafana docs before relying on it. No default password is shipped.
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
