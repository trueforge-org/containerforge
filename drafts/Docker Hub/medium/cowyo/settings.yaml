# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/schollz/cowyo"
ports:
  - port: 8001
    protocol: tcp
    required: true
env:
  - name: SQLITE_PATH
    default: "/config/cowyo2.sqlite3"
    required: false
  - name: SITE_URL
    # Public origin used for canonical links; unset is fine for local use.
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
