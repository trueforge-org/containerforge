# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/simonjenny/fastcom-mqtt"
ports: []
env:
  - name: MQTT_SERVER
    default: ""
    required: false
  - name: MQTT_PORT
    default: "1883"
    required: false
  - name: MQTT_DOWN
    default: "fastcom/download"
    required: false
  - name: MQTT_UP
    default: "fastcom/upload"
    required: false
  - name: MQTT_USER
    default: ""
    required: false
  - name: MQTT_PASS
    default: ""
    required: false
  - name: SLEEP
    default: "3600"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
opt_dependencies:
  - name: mosquitto
