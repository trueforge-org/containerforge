# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/vertex-app/vertex"
ports:
  - port: 3000
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: PORT
    default: "3000"
    required: false
  - name: REDISPORT
    default: "6379"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
