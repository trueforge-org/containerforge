; php-fpm main config for 2FAuth. Runs as the container user (no user/group lines allowed when not root).
[global]
pid = /tmp/php-fpm/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; keep container environment (DB_*, APP_* ...) visible to PHP
clear_env = no
catch_workers_output = yes
