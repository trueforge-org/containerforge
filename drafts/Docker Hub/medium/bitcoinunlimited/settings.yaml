# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://gitlab.com/bitcoinunlimited/BCHUnlimited"
ports:
  - port: 8333
    protocol: tcp
    required: false
  - port: 8332
    protocol: tcp
    required: false
env:
  - name: BITCOIN_PRUNE_MB
    default: ""
    required: false
  - name: BITCOIN_RPC_ALLOW_IP
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
