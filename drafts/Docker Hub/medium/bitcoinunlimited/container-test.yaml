# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

timeoutSeconds: 240
# UNVERIFIED: RPC (8332) is already listening before the initial header sync. Confirm in the run step.
# The tcp probes run inside the container, so RPC bound to localhost still passes.
tcp:
- port: '8333'
- port: '8332'

filePaths:
- /app/bin/bitcoind
- /app/bin/bitcoin-cli
