# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/JasonHHouse/gaps"
ports:
  - port: 8484
    protocol: tcp
    required: false
env:
  - name: BASE_URL
    default: ""
    required: false
  - name: ENABLE_LOGIN
    default: "false"
    required: false
  - name: ENABLE_SSL
    default: "false"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
