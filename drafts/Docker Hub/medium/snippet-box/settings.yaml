# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/pawelmalak/snippet-box"
ports:
  - port: 5000
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "5000"
    required: false
  - name: NODE_ENV
    default: "production"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
