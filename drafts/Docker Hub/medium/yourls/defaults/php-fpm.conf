; php-fpm pool for YOURLS. Runs as the image user (apps), so no user/group directives.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = yes

[www]
listen = /tmp/php-fpm.sock
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
; Keep the environment so config.php can read the YOURLS_* variables.
clear_env = no
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[session.save_path] = /tmp
