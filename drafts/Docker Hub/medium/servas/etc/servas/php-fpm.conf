; php-fpm pool for servas. Runs as the container user (apps), so no user/group directives.

[global]
pid = /tmp/servas/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/servas/php-fpm.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
clear_env = no
catch_workers_output = yes
php_admin_value[session.save_path] = /tmp/servas/sessions
php_admin_value[upload_tmp_dir] = /tmp/servas/uploads
php_admin_value[sys_temp_dir] = /tmp/servas
