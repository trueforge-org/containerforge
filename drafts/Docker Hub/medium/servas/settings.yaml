# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/beromir/Servas"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  # Empty default: start.sh generates and keeps the key in /config/app.key when unset.
  - name: APP_KEY
    default: ""
    required: false
  - name: APP_URL
    default: "http://localhost:8080"
    required: false
  - name: APP_ENV
    default: "production"
    required: false
  - name: APP_DEBUG
    default: "false"
    required: false
  - name: DB_CONNECTION
    default: "sqlite"
    required: false
  - name: DB_DATABASE
    default: "/config/database/sqlite/database.sqlite"
    required: false
  # mysql mode only. Empty defaults for sqlite mode.
  - name: DB_HOST
    default: ""
    required: false
  - name: DB_PORT
    default: ""
    required: false
  - name: DB_USERNAME
    default: ""
    required: false
  - name: DB_PASSWORD
    default: ""
    required: false
  - name: SERVAS_ENABLE_REGISTRATION
    default: "false"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  # Optional: sqlite mode works without it.
  - name: mariadb
