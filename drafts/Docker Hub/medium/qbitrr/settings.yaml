# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Feramance/qBitrr"
ports:
  - port: 6969
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: QBITRR_OVERRIDES_DATA_PATH
    default: "/config"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
