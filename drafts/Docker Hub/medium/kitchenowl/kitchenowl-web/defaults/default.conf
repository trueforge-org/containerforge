# __BACK_URL__ is replaced by start.sh with BACK_URL when this file is first seeded.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html/kitchenowl;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # UNVERIFIED: the upstream nginx config was not read. The proxied paths are assumed, and /api/ is the only one listed.
    location /api/ {
        proxy_pass http://__BACK_URL__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
