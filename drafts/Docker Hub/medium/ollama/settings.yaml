# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ollama/ollama"
ports:
  - port: 11434
    protocol: tcp
    required: false
env:
  - name: OLLAMA_HOST
    default: "0.0.0.0:11434"
    required: false
  - name: OLLAMA_MODELS
    default: "/config/models"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
