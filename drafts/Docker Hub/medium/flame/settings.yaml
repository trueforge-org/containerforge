# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/pawelmalak/flame"
ports:
  - port: 5005
    protocol: tcp
    required: false
env:
  # UNVERIFIED: upstream image sets PASSWORD=flame_password; this draft ships no default password. Decide before merge.
  - name: PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
