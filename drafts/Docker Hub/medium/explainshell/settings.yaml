# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/idank/explainshell"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: DB_PATH
    default: "/app/explainshell.db"
    required: false
  - name: DEBUG
    default: "false"
    required: false
  # wrapper variables read by start.sh
  - name: GUNICORN_WORKERS
    default: "2"
    required: false
  - name: GUNICORN_THREADS
    default: "4"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  # optional: a user-supplied explainshell.db here overrides the baked database
  - path: /config
    required: false
dependencies: []
