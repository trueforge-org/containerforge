# Rootless nginx config for imgpush. Derived from upstream nginx.conf at commit 9a44956.
# Changes: socket moved to /tmp, temp paths and pid under /tmp, error log to stderr.
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {}

http {
    access_log off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 5000;
        client_max_body_size 0;

        location / {
            proxy_pass http://unix:/tmp/imgpush.sock;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # internal only: used for X-Accel-Redirect file serving
        location /nginx/ {
            internal;
            alias /;
            add_header Access-Control-Allow-Origin $upstream_http_access_control_allow_origin;
            add_header Vary $upstream_http_vary;
        }
    }
}
