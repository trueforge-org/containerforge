server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /app/www;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
