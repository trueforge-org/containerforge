# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/flightaware/piaware/"
ports:
  - port: 8080
    protocol: tcp
    required: true
  - port: 30003
    protocol: tcp
    required: false
  - port: 30005
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
# UNVERIFIED: feeder variables (location, feeder id, receiver type) are not listed yet.
# Add them after reading the sdr-enthusiasts README, and map them in start.sh.
volumes:
  - path: /config
    required: true
