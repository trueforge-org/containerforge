# UNVERIFIED: draft web server config. Document root and the aircraft JSON path are not checked against the SkyAware front end.
server.port          = 8080
server.bind          = "0.0.0.0"
server.document-root = "/app/www"
server.pid-file      = "/tmp/lighttpd/lighttpd.pid"
server.errorlog      = "/proc/self/fd/2"
server.modules       = ( "mod_access", "mod_alias", "mod_staticfile", "mod_deflate" )
index-file.names     = ( "index.html" )
mimetype.assign      = (
  ".html" => "text/html",
  ".js"   => "application/javascript",
  ".css"  => "text/css",
  ".json" => "application/json",
  ".png"  => "image/png",
  ".svg"  => "image/svg+xml"
)
# Live data written by dump1090-fa under /tmp.
alias.url = ( "/data/" => "/tmp/run/dump1090/" )
