# UNVERIFIED: draft nginx config. The upstream etc/nginx files were not fetched.
# Every path is under /tmp, because the rootfs is read-only and nginx runs as the apps user.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # UNVERIFIED: upload limit. Upstream reads CLIENT_MAX_BODY_SIZE, which is not wired in yet.
    client_max_body_size 100m;

    upstream weblate {
        server unix:/tmp/run/granian/granian.sock;
    }

    server {
        listen 8080;
        server_name _;

        location /static/ {
            alias /tmp/cache/static/;
        }

        location / {
            proxy_pass http://weblate;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Startup page while granian is not up yet (for example while waiting for the database).
            proxy_intercept_errors on;
            error_page 502 503 504 /startup.html;
        }

        location = /startup.html {
            root /etc/weblate/nginx;
            internal;
        }
    }
}
