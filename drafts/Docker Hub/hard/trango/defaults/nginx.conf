worker_processes auto;
pid /tmp/trango/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # All nginx temp paths live in /tmp because the rootfs is read-only.
    client_body_temp_path /tmp/trango/client_body;
    proxy_temp_path /tmp/trango/proxy;
    fastcgi_temp_path /tmp/trango/fastcgi;
    uwsgi_temp_path /tmp/trango/uwsgi;
    scgi_temp_path /tmp/trango/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP redirects to HTTPS on 8443.
    server {
        listen 8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /config/ssl/cert.pem;
        ssl_certificate_key /config/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /app/www;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # WebSocket signalling for the discovery server (internal port 9443).
        location /server/ {
            proxy_pass http://127.0.0.1:9443/server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Flask API (internal port 8081).
        location /checkurl {
            proxy_pass http://127.0.0.1:8081/checkurl;
            proxy_set_header Host $host;
        }
    }
}
