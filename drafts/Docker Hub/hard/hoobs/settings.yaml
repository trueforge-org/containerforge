# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/hoobs-org/HOOBS"
ports:
  # UNVERIFIED: web UI port, inferred from the draft (8581). Replace with the real port after running upstream.
  - port: 8581
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
