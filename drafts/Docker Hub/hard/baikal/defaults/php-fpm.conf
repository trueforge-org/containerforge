; Rendered by start.sh to /tmp/php-fpm.conf. No user= directive: the pool runs as the apps user.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_value[session.save_path] = /tmp/php
php_admin_value[upload_tmp_dir] = /tmp
