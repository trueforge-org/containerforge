# Rendered by start.sh to /tmp/nginx/nginx.conf. Everything writable lives under /tmp.
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        # no tls and no NET_BIND_SERVICE needed, listens on all interfaces
        listen 8080;
        server_name _;

        # UNVERIFIED: Baikal public directory is html/, check after unzip at build time
        root /app/www/html;
        index index.php;

        # CalDAV and CardDAV service discovery, per sabre/dav docs
        location = /.well-known/caldav { return 301 /dav.php; }
        location = /.well-known/carddav { return 301 /dav.php; }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
