; PHP-FPM pool for Firefly III. Runs as the container user, so no user/group is set here.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Keep the environment so Laravel sees the variables set on the container.
clear_env = no
catch_workers_output = yes
