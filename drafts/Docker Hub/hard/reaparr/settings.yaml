# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Reaparr/Reaparr/"
ports:
  - port: 7000
    protocol: tcp
    required: true
env:
  - name: DOTNET_URLS
    default: "http://+:7000"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /Downloads
    required: false
  - path: /Movies
    required: false
  - path: /TvShows
    required: false
dependencies: []
