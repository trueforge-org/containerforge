# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Webreaper/Damselfly"
ports:
  - port: 6363
    protocol: tcp
    required: true
env:
  - name: SYNO_THUMBS
    default: ""
    required: false
  - name: ONDEMAND_THUMBS
    default: ""
    required: false
  - name: DAMSELFLY_BLAZORSERVER
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /thumbs
    required: false
  - path: /pictures
    required: false
