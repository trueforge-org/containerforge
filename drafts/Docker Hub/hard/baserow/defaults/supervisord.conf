[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisor/supervisord.pid
childlogdir=/tmp/supervisor

# UNVERIFIED: the full program list (gunicorn, celery workers and beat, web frontend) is a sketch. Confirm it against upstream.
[program:backend]
command=/app/baserow/venv/bin/gunicorn baserow.wsgi:application --bind 127.0.0.1:8000 --workers %(ENV_BASEROW_AMOUNT_OF_GUNICORN_WORKERS)s
directory=/app/baserow/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web-frontend]
command=node /app/baserow/web-frontend/.output/server/index.mjs
directory=/app/baserow/web-frontend
environment=HOST="127.0.0.1",PORT="3000"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/caddy run --config /tmp/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
