# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/baserow/baserow"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: BASEROW_PUBLIC_URL
    default: "http://localhost:8080"
    required: true
  - name: DATABASE_HOST
    default: "postgresql"
    required: true
  - name: DATABASE_PORT
    default: "5432"
    required: false
  - name: DATABASE_NAME
    default: "baserow"
    required: false
  - name: DATABASE_USER
    default: "baserow"
    required: false
  - name: DATABASE_PASSWORD
    default: ""
    required: true
  - name: REDIS_HOST
    default: "valkey"
    required: true
  - name: REDIS_PORT
    default: "6379"
    required: false
  - name: REDIS_PASSWORD
    default: ""
    required: false
  - name: SECRET_KEY
    default: ""
    required: false
  - name: BASEROW_AMOUNT_OF_GUNICORN_WORKERS
    default: "2"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
  - name: valkey
