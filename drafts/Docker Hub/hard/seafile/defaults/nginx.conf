# Front proxy for Seafile on 8080 (no TLS; use an ingress for HTTPS).
# Started in daemon mode before the database wait, so the port answers during startup.
# All runtime paths are under /tmp so the rootfs can stay read-only.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    client_max_body_size 0;

    server {
        listen 8080;
        server_name _;

        # Seafile fileserver (upload and download)
        location /seafhttp {
            rewrite ^/seafhttp(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8082;
            proxy_request_buffering off;
            proxy_connect_timeout 36000s;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
        }

        # Seahub static media, collected by the upstream image
        location /media {
            root /app/seafile-server/seahub;
        }

        # Seahub (Django) on gunicorn
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1200s;
        }
    }
}
