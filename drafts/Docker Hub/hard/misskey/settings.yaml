# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/misskey-dev/misskey"
ports:
  - port: 3000
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: MISSKEY_URL
    default: ""
    required: true
  - name: PORT
    default: "3000"
    required: false
  - name: DATABASE_HOST
    default: "postgresql"
    required: false
  - name: DATABASE_PORT
    default: "5432"
    required: false
  - name: DATABASE_DB
    default: "misskey"
    required: false
  - name: DATABASE_USER
    default: "misskey"
    required: false
  - name: DATABASE_PASSWORD
    default: ""
    required: true
  - name: REDIS_HOST
    default: "valkey"
    required: false
  - name: REDIS_PORT
    default: "6379"
    required: false
  - name: REDIS_PASSWORD
    default: ""
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
  - name: valkey
