# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/OpenFactorioServerManager/factorio-server-manager"
ports:
  - port: 8080
    protocol: tcp
    required: false
  - port: 34197
    protocol: udp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: FACTORIO_VERSION
    default: "stable"
    required: false
  - name: RCON_PASS
    default: ""
    required: false
  - name: PORT
    default: "8080"
    required: false
volumes:
  - path: /config
    required: true
