# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/codeproject/CodeProject.AI-Server"
# Port 5000 (legacy) is left out: it is UNVERIFIED that it listens inside this container.
ports:
  - port: 32168
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: ASPNETCORE_URLS
    default: "http://0.0.0.0:32168"
    required: false
volumes:
  - path: /config
    required: true
