# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/afterlogic/aurora-files"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: DB_HOST
    default: ""
    required: false
  - name: DB_PORT
    default: "3306"
    required: false
  - name: DB_NAME
    default: "afterlogic"
    required: false
  - name: DB_USER
    default: "afterlogic"
    required: false
  - name: DB_PASSWORD
    default: ""
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: mariadb
