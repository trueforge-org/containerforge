; PHP settings for Aurora Files, copied into the fpm and cli conf.d by the Dockerfile.
; UNVERIFIED: the limits are placeholders, tune them against real uploads.
memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
date.timezone = Etc/UTC
session.save_path = /tmp/php/sessions
upload_tmp_dir = /tmp/php/uploads
