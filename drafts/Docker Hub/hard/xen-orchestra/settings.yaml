# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/vatesfr/xen-orchestra/"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: HTTP_PORT
    default: "8080"
    required: false
  - name: XO_REDIS_URI
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: valkey
