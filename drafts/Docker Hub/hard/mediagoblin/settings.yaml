# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://git.sr.ht/~mediagoblin/mediagoblin"
ports:
  - port: 6543
    protocol: tcp
    required: false
env:
  - name: ADMIN_EMAIL
    default: "admin@example.com"
    required: false
  - name: ADMIN_PASSWORD
    # Empty means start.sh generates one on first start and logs it once.
    default: ""
    required: false
  - name: ADMIN_USER
    default: "admin"
    required: false
  - name: CELERY_ALWAYS_EAGER
    # Read by the app itself. No separate celery worker runs in this image.
    default: "true"
    required: false
  - name: SQL_ENGINE
    # Optional PostgreSQL URL. Written into mediagoblin.ini, so it holds a DB password in /config.
    # Review before merge. Empty keeps the default SQLite in /config.
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
