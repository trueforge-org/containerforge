worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 200;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip_static on;

    client_body_temp_path /tmp/nginx-temp/client;
    proxy_temp_path /tmp/nginx-temp/proxy;
    fastcgi_temp_path /tmp/nginx-temp/fastcgi;
    uwsgi_temp_path /tmp/nginx-temp/uwsgi;
    scgi_temp_path /tmp/nginx-temp/scgi;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /app/www;
        index index.php index.html;

        # The SQLite file and config.inc.php are in /config/data (via the data symlink) and must not be served.
        location ^~ /data/ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
