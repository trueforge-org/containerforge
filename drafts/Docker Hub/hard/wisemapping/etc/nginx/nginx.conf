worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset UTF-8;
    sendfile on;
    gzip on;
    access_log /dev/stdout;

    # All temp paths are writable under /tmp (read-only rootfs)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        # Unprivileged port, the container runs as apps
        listen 8080;
        server_name _;
        root /app/www;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # UNVERIFIED: $base_scheme is a variable upstream defines; $scheme is used here
        location / {
            try_files $uri /index.html;
            sub_filter '<base>' '<base href="$scheme://$http_host/">';
            sub_filter_once on;
        }

        location /c/ {
            try_files /index.html =404;
        }

        location = /api/restful/app/config {
            proxy_pass http://127.0.0.1:8081/api/restful/app/config;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json;
            sub_filter 'http://localhost:8080' '$scheme://$http_host';
            sub_filter 'http://localhost:3000' '$scheme://$http_host';
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ~ ^/(oauth2|login/oauth2)/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
