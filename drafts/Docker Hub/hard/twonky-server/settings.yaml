# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://www.twonky.com/download/"
ports:
  - port: 9000
    protocol: tcp
    required: false
  # UPnP/SSDP discovery. Needs host or LAN networking to be useful.
  - port: 1900
    protocol: udp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
