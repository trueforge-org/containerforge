# Rootless Apache config for Observium (ContainerForge). Runs as the apps user.
# UNVERIFIED: module paths and libphp file name for PHP 8.5 on ubuntu 26.04; check on first build.
ServerRoot "/etc/apache2"
PidFile /tmp/apache/run/apache2.pid
Mutex file:/tmp/apache/lock default
ErrorLog /dev/stderr
LogLevel warn

Listen 0.0.0.0:8080
ServerName localhost

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule unixd_module /usr/lib/apache2/modules/mod_unixd.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule log_config_module /usr/lib/apache2/modules/mod_log_config.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.5.so

TypesConfig /etc/mime.types
CustomLog /dev/stdout combined

DocumentRoot "/app/observium/html"
<Directory "/app/observium/html">
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

# Writable PHP paths live in /tmp; /app is read-only.
php_admin_value session.save_path /tmp/php-sessions
php_admin_value sys_temp_dir /tmp
