# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/dockovpn/dockovpn"
ports:
  - port: 1194
    protocol: udp
    required: true
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: NET_ADAPTER
    default: "eth0"
    required: false
  # Used by client config generation, which is not ported yet (see start.sh)
  - name: HOST_ADDR
    default: ""
    required: false
  - name: HOST_TUN_PORT
    default: "1194"
    required: false
  - name: HOST_CONF_PORT
    default: "8080"
    required: false
  - name: CRL_DAYS
    default: "3650"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
