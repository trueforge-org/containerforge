[global]
error_log = /proc/self/fd/2
daemonize = no
pid = /tmp/php/php-fpm.pid

; Runs as the unprivileged apps user, so no user/group directives here.
[www]
listen = /tmp/php-fpm.sock
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
