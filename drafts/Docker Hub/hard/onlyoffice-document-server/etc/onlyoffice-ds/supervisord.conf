; Rootless supervisord config (no `user=` directives, everything runs as apps)
; UNVERIFIED: program command paths and environment, confirm against the vendor supervisor configs after install

[supervisord]
nodaemon=true
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisor/supervisord.pid

; Bundled RabbitMQ (no ContainerForge rabbitmq app yet). UNVERIFIED: rootless operation.
[program:rabbitmq]
command=/usr/lib/rabbitmq/bin/rabbitmq-server
environment=RABBITMQ_MNESIA_BASE="/config/rabbitmq",RABBITMQ_NODENAME="rabbit@localhost",HOME="/config/rabbitmq"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:docservice]
command=/var/www/onlyoffice/documentserver/server/DocService/docservice
directory=/var/www/onlyoffice/documentserver/server/DocService
environment=NODE_ENV="production-linux",NODE_CONFIG_DIR="/etc/onlyoffice/documentserver",HOME="/config"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:converter]
command=/var/www/onlyoffice/documentserver/server/FileConverter/converter
directory=/var/www/onlyoffice/documentserver/server/FileConverter
environment=NODE_ENV="production-linux",NODE_CONFIG_DIR="/etc/onlyoffice/documentserver",HOME="/config"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/onlyoffice-ds/nginx-ds.conf -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
