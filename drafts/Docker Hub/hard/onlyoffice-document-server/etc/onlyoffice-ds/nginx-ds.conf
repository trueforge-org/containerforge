worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;

    # Runtime temp paths under /tmp (read-only rootfs), no `user` directive (runs as apps)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Vendor server block; the Dockerfile changes its listen port from 80 to 8080
    # UNVERIFIED: vendor path and whether it needs further includes
    include /etc/onlyoffice/documentserver/nginx/ds.conf;
}
