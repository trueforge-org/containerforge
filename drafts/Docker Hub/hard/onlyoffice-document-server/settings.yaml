# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ONLYOFFICE/DocumentServer"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: ALLOW_PRIVATE_IP_ADDRESS
    default: "false"
    required: false
  - name: DB_HOST
    default: "postgresql"
    required: true
  - name: DB_NAME
    default: "onlyoffice"
    required: false
  - name: DB_PORT
    default: "5432"
    required: false
  - name: DB_PWD
    default: "onlyoffice"
    required: true
  - name: DB_TYPE
    default: "postgres"
    required: false
  - name: DB_USER
    default: "onlyoffice"
    required: false
  - name: JWT_ENABLED
    default: "true"
    required: false
  - name: JWT_SECRET
    default: ""
    required: false
  - name: REDIS_SERVER_HOST
    default: "valkey"
    required: false
  - name: REDIS_SERVER_PORT
    default: "6379"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: WOPI_ENABLED
    default: "false"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
  - name: valkey
