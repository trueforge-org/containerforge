[global]
pid = /tmp/pla/php-fpm.pid
error_log = /tmp/pla/logs/php-fpm.log

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Keep the container environment (APP_KEY, LDAP_*) visible to PHP
clear_env = no
catch_workers_output = yes
