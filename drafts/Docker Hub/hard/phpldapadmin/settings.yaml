# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/leenooks/phpLDAPadmin/"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  # LDAP_HOST is required upstream; not marked required here so the image starts without it (start.sh warns)
  - name: LDAP_HOST
    default: ""
    required: false
  - name: LDAP_USERNAME
    default: ""
    required: false
  - name: LDAP_PASSWORD
    default: ""
    required: false
  # Generated by start.sh into /config/pla/app.key when empty
  - name: APP_KEY
    default: ""
    required: false
  - name: APP_TIMEZONE
    default: "UTC"
    required: false
  - name: LDAP_CACHE
    default: "false"
    required: false
  - name: CACHE_DRIVER
    default: "file"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
