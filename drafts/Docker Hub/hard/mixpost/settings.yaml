# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/inovector/mixpost"
ports:
  # Upstream listens on 80, which a non-root user cannot bind.
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: APP_NAME
    default: "Mixpost"
    required: false
  # Required, with no default. start.sh serves a setup page instead of Mixpost when it is empty.
  - name: APP_URL
    default: ""
    required: true
  # Generated by start.sh on first run into /config/.app_key when unset.
  - name: APP_KEY
    default: ""
    required: false
  - name: APP_DEBUG
    default: "false"
    required: false
  - name: DB_HOST
    default: "mariadb"
    required: false
  - name: DB_PORT
    default: "3306"
    required: false
  - name: DB_DATABASE
    default: "mixpost"
    required: false
  - name: DB_USERNAME
    default: "mixpost"
    required: false
  # Required, with no default. start.sh serves a setup page instead of Mixpost when it is empty.
  - name: DB_PASSWORD
    default: ""
    required: true
  - name: REDIS_HOST
    default: "valkey"
    required: false
  - name: REDIS_PORT
    default: "6379"
    required: false
  - name: REDIS_PASSWORD
    default: ""
    required: false
  - name: MIXPOST_DISK
    default: "public"
    required: false
  # UNVERIFIED: the stderr channel is not listed in the Mixpost docs (they list single and daily).
  - name: LOG_CHANNEL
    default: "stderr"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: mariadb
  - name: valkey
