; Copied to /tmp/php/fpm.conf by start.sh. The pool runs as the current user (apps), so no user or group is set.
[global]
pid = /tmp/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[mixpost]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Keep the environment, so the settings from start.sh reach Laravel.
clear_env = no
catch_workers_output = yes
