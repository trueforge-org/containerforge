# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Cisco-Talos/clamav/"
ports:
  - port: 3310
    protocol: tcp
    required: false
env:
  - name: CLAMAV_NO_FRESHCLAMD
    default: "false"
    required: false
  - name: FRESHCLAM_CHECKS
    default: "1"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
