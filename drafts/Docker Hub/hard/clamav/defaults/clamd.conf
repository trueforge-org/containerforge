# Seeded to /config/clamd.conf on first start. Edit the copy in /config, not this file.
# The image runs as a non-root user with a read-only root filesystem, so every path is under /config or /tmp.
DatabaseDirectory /config/database
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
PidFile /tmp/clamd.pid
Foreground yes
LogTime yes
LogSyslog no
