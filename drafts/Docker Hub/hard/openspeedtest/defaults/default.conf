# Replaces the nginx base's default site. The base entrypoint copies it to /config/sites on first start.
server {
    listen 8080 default_server;
    # IPv4 only. Add a [::]:8080 listener only where IPv6 is available, since nginx fails to start without it.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 35m;
    error_page 405 =200 $uri;
    access_log off;
    gzip off;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    tcp_nopush on;

    location / {
        # UNVERIFIED: header values below are representative. Copy the exact values from upstream
        # files/OpenSpeedTest-Server.conf, which was not fetched.
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Content-Type, Content-Length, Cache-Control" always;
        if_modified_since off;
        expires off;
        etag off;

        if ($request_method = OPTIONS) {
            return 200;
        }

        try_files $uri $uri/ =404;
    }

    # Static assets can be cached. The download payload and the upload target are not matched here.
    location ~* \.(css|js|svg)$ {
        expires 365d;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }
}
