# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://www.kerio.com/"
ports:
  - port: 4040
    protocol: tcp
    required: true
  - port: 80
    protocol: tcp
    required: false
  - port: 443
    protocol: tcp
    required: false
  - port: 25
    protocol: tcp
    required: false
  - port: 465
    protocol: tcp
    required: false
  - port: 587
    protocol: tcp
    required: false
  - port: 110
    protocol: tcp
    required: false
  - port: 995
    protocol: tcp
    required: false
  - port: 143
    protocol: tcp
    required: false
  - port: 993
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /backup
    required: false
dependencies: []
