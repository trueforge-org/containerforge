# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Difegue/LANraragi"
ports:
  - port: 3000
    protocol: tcp
    required: true
# Valkey (6379) is bound to 127.0.0.1 inside the container and is not exposed, so it is not listed.
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: LRR_NETWORK
    default: "http://*:3000"
    required: false
  - name: MOJO_PROXY
    default: "1"
    required: false
  - name: MOJO_REVERSE_PROXY
    default: "1"
    required: false
volumes:
  # holds content, thumb, database and plugins
  - path: /config
    required: true
dependencies: []
