# tar1090 web UI on 8080. Overrides the nginx base default, which is copied once to /config/sites/ by docker-entrypoint.d.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app/tar1090/html;
    index index.html;

    # Site config is seeded to /config so it can be edited.
    location = /config.js {
        alias /config/config.js;
    }

    # readsb writes aircraft.json into /tmp/run/readsb.
    # UNVERIFIED: history and globe paths the tar1090 page requests.
    location /data/ {
        alias /tmp/run/readsb/;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
