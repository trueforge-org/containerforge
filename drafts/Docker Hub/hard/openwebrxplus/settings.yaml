# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/luarvique/openwebrx"
ports:
  - port: 8073
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: OPENWEBRX_ADMIN_USER
    default: ""
    required: false
  - name: OPENWEBRX_ADMIN_PASSWORD
    default: ""
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
