# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/plausible/analytics/"
ports:
  - port: 8000
    protocol: tcp
    required: false
env:
  - name: BASE_URL
    default: "http://localhost:8000"
    required: false
  # Generated into /config/secret_key_base when empty
  - name: SECRET_KEY_BASE
    default: ""
    required: false
  # UNVERIFIED env name; ClickHouse and Postgres connection strings
  - name: DATABASE_URL
    default: ""
    required: false
  - name: CLICKHOUSE_DATABASE_URL
    default: ""
    required: false
  # UNVERIFIED env name and format; generated into /config when empty
  - name: TOTP_VAULT_KEY
    default: ""
    required: false
  - name: LISTEN_IP
    default: "0.0.0.0"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
  - name: clickhouse
