# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/sahib/rmlint"
ports: []
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: RMLINT_ARGS
    default: ""
    required: false
volumes:
  - path: /config
    required: true
  - path: /data
    required: false
dependencies: []
