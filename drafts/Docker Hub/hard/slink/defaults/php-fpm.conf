; UNVERIFIED: draft pool config. Adjust after the upstream PHP setup is read.
[global]
pid = /tmp/slink/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/slink/php/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
; Writes go to /tmp only, because /app is read-only at runtime.
php_admin_value[session.save_path] = /tmp/slink/php
php_admin_value[upload_tmp_dir] = /tmp/slink/php
; UNVERIFIED: ext-ffi needs ffi.enable for FPM. Confirm the right value at runtime.
php_admin_value[ffi.enable] = true
