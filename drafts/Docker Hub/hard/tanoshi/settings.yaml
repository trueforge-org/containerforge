# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/luigi311/tanoshi"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: TANOSHI_HOME
    default: "/config"
    required: false
  - name: TANOSHI_LOG
    default: "info"
    required: false
  - name: PORT
    default: "8080"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
