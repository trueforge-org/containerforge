# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/EdwardChamberlain/IPMI-Fan-Controller"
ports:
  - port: 5000
    protocol: tcp
    required: true
env:
  - name: APP_IPMI_HOST
    default: ""
    required: false
  - name: APP_IPMI_USER
    default: ""
    required: false
  - name: APP_IPMI_PASS
    default: ""
    required: false
  - name: SECRET_KEY
    default: ""
    required: false
  - name: APP_LOG_LEVEL
    default: "INFO"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
dependencies: []
