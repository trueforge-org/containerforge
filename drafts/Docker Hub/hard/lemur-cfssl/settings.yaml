# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Netflix/lemur"
ports:
  - port: 8000
    protocol: tcp
    required: true
  - port: 8888
    protocol: tcp
    required: false
env:
  # UNVERIFIED: names are ContainerForge-defined and read by defaults/lemur.conf.py, not by Lemur directly.
  # No default: the database is external (postgresql). Lemur cannot start without it.
  - name: LEMUR_DATABASE_URI
    default: ""
    required: true
  # Generated by start.sh on first run into /config/lemur.secrets when unset.
  - name: LEMUR_SECRET_KEY
    default: ""
    required: true
  - name: LEMUR_TOKEN_SECRET
    default: ""
    required: true
  - name: LEMUR_ENCRYPTION_KEYS
    default: ""
    required: true
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
opt_dependencies:
  - name: valkey
