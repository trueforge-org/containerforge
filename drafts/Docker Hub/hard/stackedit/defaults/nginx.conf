worker_processes auto;
pid /tmp/nginx.pid;
error_log /proc/self/fd/2 warn;

events {
    worker_connections 1024;
}

http {
    # UNVERIFIED: mime.types path in the nginx base image.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /proc/self/fd/1;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-temp/client_body;
    proxy_temp_path /tmp/nginx-temp/proxy;
    fastcgi_temp_path /tmp/nginx-temp/fastcgi;
    uwsgi_temp_path /tmp/nginx-temp/uwsgi;
    scgi_temp_path /tmp/nginx-temp/scgi;

    include /config/sites/*.conf;
}
