# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/grafana/grafana-image-renderer"
ports:
  - port: 8081
    protocol: tcp
    required: false
env:
  - name: SERVER_ADDR
    default: ":8081"
    required: false
  # Upstream default is "-" (no auth). Set a secret; the Grafana GF_RENDERING_RENDERER_TOKEN must match.
  - name: AUTH_TOKEN
    default: "-"
    required: false
  - name: BROWSER_FLAGS
    default: "--no-sandbox --disable-dev-shm-usage"
    required: false
  - name: CHROME_BIN
    default: "/usr/local/bin/chromium"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
