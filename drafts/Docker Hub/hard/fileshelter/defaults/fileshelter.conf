# Seeded to /config/fileshelter.conf on first start (only when missing).
# Based on upstream conf/fileshelter.conf at v6.4.0, with paths moved to the read-only install prefix
# and working-dir moved to the /config volume.
# UNVERIFIED: this is a subset of the upstream sample. Merge the remaining upstream keys before merging to apps/.

working-dir = "/config";
log-file = "";
access-log-file = "";
log-config = "* -debug -info:WebRequest";

max-share-size = 100;
upload-passwords = ( );

listen = "0.0.0.0:5091";
behind-reverse-proxy = false;
original-ip-header = "X-Forwarded-For";
trusted-proxies = ("127.0.0.1", "::1");

docroot = "/usr/local/share/fileshelter/docroot/;/resources,/css,/images,/js,/favicon.ico";
approot = "/usr/local/share/fileshelter/approot";
wt-resources = "/usr/local/share/Wt/resources";
