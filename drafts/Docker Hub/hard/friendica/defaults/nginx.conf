# Loaded with: nginx -c /defaults/nginx.conf. Every writable path is under /tmp because the rootfs is read-only.
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-temp/client_body;
    proxy_temp_path /tmp/nginx-temp/proxy;
    fastcgi_temp_path /tmp/nginx-temp/fastcgi;
    uwsgi_temp_path /tmp/nginx-temp/uwsgi;
    scgi_temp_path /tmp/nginx-temp/scgi;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512m;

    server {
        listen 8080;
        server_name _;
        root /app/www;
        index index.php;

        # UNVERIFIED: directories Friendica expects to be unreachable over HTTP
        location ~ ^/(bin|config|src|vendor)/ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 300;
        }

        location ~ /\. {
            deny all;
        }
    }
}
