# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/friendica/friendica"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: FRIENDICA_ADMIN_MAIL
    default: ""
    required: false
  - name: FRIENDICA_URL
    default: ""
    required: false
  - name: MYSQL_DATABASE
    default: ""
    required: false
  - name: MYSQL_HOST
    default: ""
    required: false
  - name: MYSQL_PASSWORD
    default: ""
    required: false
  - name: MYSQL_PORT
    default: "3306"
    required: false
  - name: MYSQL_USER
    default: ""
    required: false
  - name: PHP_MEMORY_LIMIT
    default: "512M"
    required: false
  - name: PHP_UPLOAD_LIMIT
    default: "512M"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: mariadb
opt_dependencies:
  - name: valkey
