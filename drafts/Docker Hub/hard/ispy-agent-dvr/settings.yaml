# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://www.ispyconnect.com/"
ports:
  - port: 8090
    protocol: tcp
    required: true
  - port: 3478
    protocol: udp
    required: false
  # WebRTC range 50000-50100/udp. UNVERIFIED: whether the schema can express a range; listed by first port.
  - port: 50000
    protocol: udp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
