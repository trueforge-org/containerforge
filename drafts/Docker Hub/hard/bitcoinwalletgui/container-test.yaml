# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

timeoutSeconds: 300
tcp:
- port: '3000'
filePaths:
- /app/bin/bitcoin-qt
- /app/bin/bitcoind
- /usr/share/licenses/bitcoinwalletgui/COPYING
runners:
# UNVERIFIED: bitcoin-qt may not ship for aarch64. If it does not, arm64 is blocked.
- entrypoint: /app/bin/bitcoin-cli --version
