# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/lancachenet/lancache-dns"
ports:
  - port: 53
    protocol: udp
    required: true
  - port: 53
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: UPSTREAM_DNS
    default: "8.8.8.8"
    required: false
  - name: ENABLE_DNSSEC_VALIDATION
    default: "false"
    required: false
volumes:
  - path: /config
    required: false
dependencies: []
