# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Steam-Headless/docker-steam-headless"
ports:
  # noVNC web client. Sunshine ports are not listed until the image opens them.
  - port: 8083
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: DISPLAY_SIZEW
    default: "1600"
    required: false
  - name: DISPLAY_SIZEH
    default: "900"
    required: false
  - name: DISPLAY_CDEPTH
    default: "24"
    required: false
  # Empty means no VNC password.
  - name: WEBUI_PASS
    default: ""
    required: false
  - name: ENABLE_STEAM
    default: "true"
    required: false
  - name: STEAM_ARGS
    default: "-silent"
    required: false
volumes:
  - path: /config
    required: true
