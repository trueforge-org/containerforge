[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :55 -screen 0 %(ENV_DISPLAY_SIZEW)sx%(ENV_DISPLAY_SIZEH)sx%(ENV_DISPLAY_CDEPTH)s -nolisten tcp
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:pulseaudio]
; UNVERIFIED: the module-native-protocol-unix socket path must match PULSE_SERVER in the Dockerfile.
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --system=false -n -L "module-native-protocol-unix socket=/tmp/pulse/pulse-socket" -L "module-null-sink"
priority=15
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:x11vnc]
command=/scripts/x11vnc-run.sh
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:websockify]
; noVNC web client and WebSocket bridge on all interfaces, proxying to the local VNC port.
command=/usr/bin/websockify --web /usr/share/novnc/ 0.0.0.0:8083 localhost:5900
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:xfce]
command=/usr/bin/dbus-run-session -- /usr/bin/startxfce4
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:steam]
command=/usr/bin/steam %(ENV_STEAM_ARGS)s
autostart=%(ENV_ENABLE_STEAM)s
autorestart=false
priority=40
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
