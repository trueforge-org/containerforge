; Template. start.sh renders @PHP_MEMORY_LIMIT@ into /tmp/php/ini/farmOS.ini.
; Values follow the upstream farmOS image conf.d settings.
memory_limit = @PHP_MEMORY_LIMIT@
max_execution_time = 240
max_input_time = 240
max_input_vars = 5000
post_max_size = 100M
upload_max_filesize = 100M
expose_php = Off
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 3600
