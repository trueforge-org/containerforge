# Used by start.sh (nginx -c /etc/farmos/nginx.conf). Every path is writable by the apps user.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # Drupal and farmOS uploads: upstream PHP limits are 100M
    client_max_body_size 100m;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    scgi_temp_path /tmp/nginx/scgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;

    server {
        listen 8080;
        server_name _;

        root /app/farmos/web;
        index index.php;

        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ '\.php$|^/update.php' {
            fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
            try_files $uri =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_pass unix:/tmp/php/php-fpm.sock;
        }

        # Keep Drupal internals from being served as static files
        location ~ ^/(core|profiles|vendor)/.*\.(txt|md|yml|lock|json)$ {
            return 403;
        }
    }
}
