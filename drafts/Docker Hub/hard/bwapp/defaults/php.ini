; PHP overrides for the rootless, read-only-rootfs container (loaded via PHPIniDir /defaults)
; Writable locations go to /tmp (sessions, uploads, temp)
session.save_path = /tmp
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
; bWAPP is a deliberately vulnerable training app; errors are shown for the lab use case
display_errors = On
; Loads the env-driven DB settings before each request
auto_prepend_file = /defaults/settings.php
