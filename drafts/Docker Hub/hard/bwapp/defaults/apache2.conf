# Rootless Apache config, run as: apache2 -f /defaults/apache2.conf -DFOREGROUND
# No User/Group directives (the container runs as apps). Runtime files go to /tmp.
# UNVERIFIED: module paths and names on ubuntu 26.04 (mods-enabled is populated by a2enmod at build)
ServerRoot "/etc/apache2"
Listen 8080
PidFile /tmp/apache/apache2.pid
DefaultRuntimeDir /tmp/apache
Mutex file:/tmp/apache
ErrorLog /dev/stderr
LogLevel warn
CustomLog /dev/stdout combined

IncludeOptional /etc/apache2/mods-enabled/*.load
IncludeOptional /etc/apache2/mods-enabled/*.conf

# PHP ini overrides for mod_php
PHPIniDir /defaults

DocumentRoot "/app/www"
<Directory "/app/www">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html
AddType application/x-httpd-php .php
TypesConfig /etc/mime.types
