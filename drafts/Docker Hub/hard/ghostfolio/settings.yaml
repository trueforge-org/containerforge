# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ghostfolio/ghostfolio"
ports:
  - port: 3333
    protocol: tcp
    required: false
env:
  - name: ACCESS_TOKEN_SALT
    default: ""
    required: false
  - name: DATABASE_URL
    # Required. start.sh exits with a clear message when it is empty.
    default: ""
    required: true
  - name: JWT_SECRET_KEY
    default: ""
    required: false
  - name: PORT
    default: "3333"
    required: false
  - name: REDIS_HOST
    # Required by upstream docs. start.sh exits with a clear message when it is empty.
    default: ""
    required: true
  - name: REDIS_PASSWORD
    default: ""
    required: false
  - name: REDIS_PORT
    default: "6379"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
  - name: valkey
