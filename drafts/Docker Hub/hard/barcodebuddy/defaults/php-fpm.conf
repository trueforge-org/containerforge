; Rendered to /tmp/php-fpm.conf by start.sh. Runs as the apps user, so no user/group are set.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = dynamic
; Upstream raises this to 20 because websockets/SSE hold workers open
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /tmp/php
