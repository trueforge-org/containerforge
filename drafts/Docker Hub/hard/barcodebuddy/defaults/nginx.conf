# Rendered to /tmp/nginx-conf.d/bbuddy.conf by start.sh and included by the image's nginx.conf
server {
    listen 8080;
    server_name _;

    root /app/bbuddy;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/tmp/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # TODO: websocket location (upstream proxies the wsserver through nginx). The internal
    # wsserver port is UNVERIFIED, so it is not written here yet.
}
