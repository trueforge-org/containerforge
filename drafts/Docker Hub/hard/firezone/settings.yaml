# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/firezone/firezone"
ports:
  - port: 13000
    protocol: tcp
    required: false
  # WireGuard. No tcp probe can cover UDP (UNVERIFIED forgetool UDP support).
  - port: 51820
    protocol: udp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: PHOENIX_HTTP_PORT
    default: "13000"
    required: false
  - name: EXTERNAL_URL
    default: "http://localhost:13000"
    required: false
  - name: DATABASE_HOST
    default: "postgres"
    required: false
  - name: DATABASE_PORT
    default: "5432"
    required: false
  - name: DATABASE_NAME
    default: "firezone"
    required: false
  - name: DATABASE_USER
    default: "postgres"
    required: false
  - name: DATABASE_PASSWORD
    default: ""
    required: false
  - name: DEFAULT_ADMIN_EMAIL
    default: ""
    required: false
  - name: DEFAULT_ADMIN_PASSWORD
    default: ""
    required: false
  - name: RESET_ADMIN_ON_BOOT
    default: "false"
    required: false
  # the following secrets are generated by start.sh on first run and kept in /config
  - name: SECRET_KEY_BASE
    default: ""
    required: false
  - name: GUARDIAN_SECRET_KEY
    default: ""
    required: false
  - name: DATABASE_ENCRYPTION_KEY
    default: ""
    required: false
  - name: LIVE_VIEW_SIGNING_SALT
    default: ""
    required: false
  - name: COOKIE_SIGNING_SALT
    default: ""
    required: false
  - name: COOKIE_ENCRYPTION_SALT
    default: ""
    required: false
  - name: WIREGUARD_PORT
    default: "51820"
    required: false
  - name: WIREGUARD_INTERFACE_NAME
    default: "wg-firezone"
    required: false
  # UNVERIFIED: upstream 0.7 default is true, the plan sets false
  - name: TELEMETRY_ENABLED
    default: "false"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
    required: true
