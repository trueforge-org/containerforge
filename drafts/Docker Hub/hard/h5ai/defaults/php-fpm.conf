[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
; Runs as the current user (apps); nginx connects over this socket
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
catch_workers_output = yes
clear_env = no
php_admin_value[session.save_path] = /tmp/php
php_admin_value[upload_tmp_dir] = /tmp/php
