worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;

    # All nginx temp paths must be writable on a read-only rootfs
    client_body_temp_path /tmp/nginx-temp/client;
    proxy_temp_path /tmp/nginx-temp/proxy;
    fastcgi_temp_path /tmp/nginx-temp/fastcgi;
    uwsgi_temp_path /tmp/nginx-temp/uwsgi;
    scgi_temp_path /tmp/nginx-temp/scgi;

    server {
        listen 8080;
        server_name _;

        # Browsed directory (mount point for the files to list)
        root /h5ai;
        index index.php;

        location / {
            try_files $uri $uri/ /_h5ai/public/index.php?$query_string;
        }

        location /_h5ai/ {
            alias /app/h5ai/_h5ai/;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }
}
