filePaths:
- /start.sh
- /app/www/index.php
- /app/www/retrieve.php
- /usr/share/licenses/spotweb/LICENSE.md
- /defaults/nginx.conf
- /defaults/php-fpm.conf
runners:
- entrypoint: php --version
