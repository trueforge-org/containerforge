; php-fpm pool for Spotweb, running as the non-root apps user.
; user/group are not set: php-fpm ignores them when not started as root.

[global]
pid = /tmp/php/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = /tmp/php/php-fpm.sock
pm = ondemand
pm.max_children = 5
clear_env = no
catch_workers_output = yes
