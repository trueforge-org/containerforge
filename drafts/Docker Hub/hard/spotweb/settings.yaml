# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/spotweb/spotweb"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  # Read by start.sh, not by Spotweb itself.
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: DB_ENGINE
    default: "pdo_pgsql"
    required: false
  - name: DB_HOST
    default: ""
    required: true
  - name: DB_PORT
    default: "5432"
    required: false
  - name: DB_NAME
    default: "spotweb"
    required: false
  - name: DB_USER
    default: "spotweb"
    required: true
  - name: DB_PASS
    default: ""
    required: true
  - name: SPOTWEB_RETRIEVE_INTERVAL
    default: "3600"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - postgresql
