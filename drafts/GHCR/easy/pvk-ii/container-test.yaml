# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

# UNVERIFIED: the server downloads on first start, so the tcp probe needs a long timeout.
# The probe assumes RCON listens on 27015/tcp (UNVERIFIED). The UDP game port has no probe.
timeoutSeconds: 900
tcp:
- port: '27015'
filePaths:
- /start.sh
- /usr/local/share/steamcmd/steamcmd.sh
