# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://www.vankrupt.com/"
ports:
  # UNVERIFIED: add the game, query and Steam ports only after they are confirmed from the Pavlov server docs.
  []
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: STEAM_APP_IDS
    default: "622970"
    required: false
  - name: STEAM_INSTALL_DIR
    default: "/config/pavlovvr"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
