# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://stationeers.net/"
ports:
  # UNVERIFIED: game port (27015 per the ich777 README; the draft said 27016).
  - port: 27015
    protocol: udp
    required: true
  - port: 27500
    protocol: udp
    required: false
env:
  - name: STEAM_APP_IDS
    default: "600760"
    required: true
  - name: STEAM_INSTALL_DIR
    default: "/config/stationeers"
    required: false
  - name: STEAM_APP_VALIDATE
    default: "false"
    required: false
  - name: GAME_PARAMS
    default: "-difficulty easy -loadlatest Mars Mars"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
