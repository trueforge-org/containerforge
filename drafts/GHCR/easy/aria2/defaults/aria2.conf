# Seeded to /config/aria2.conf only when it is missing. Edits in /config are kept.
# UNVERIFIED: each option name must be checked against `aria2c --help` in the built image.

# RPC: listen on all interfaces so other containers can reach it.
enable-rpc=true
rpc-listen-all=true

# Session and DHT state live in /config.
save-session=/config/aria2.session
input-file=/config/aria2.session
dht-file-path=/config/dht.dat
dht-file-path6=/config/dht6.dat
