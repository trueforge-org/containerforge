server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /app/www;
    index index.html;
    charset utf-8;

    # Generated by docker-entrypoint.d/10-shlink.sh in /config (writable state).
    location = /servers.json {
        alias /config/servers.json;
    }

    # Caching rules from the upstream config/docker/nginx.conf (v4.9.1).
    location ~* \.(webmanifest|html|xml|json)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|gz|mp4)$ {
        expires 1M;
        add_header Cache-Control "public" always;
        try_files $uri $uri/ =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html$is_args$args;
    }

    error_page 404 /404.html;
    location = /404.html {}

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {}
}
