# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/drakkan/sftpgo"
ports:
  - port: 2022
    protocol: tcp
    required: true
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: SFTPGO_LOG_FILE_PATH
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
