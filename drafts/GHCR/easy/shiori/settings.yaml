# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/go-shiori/shiori"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: SHIORI_HTTP_PORT
    default: "8080"
    required: false
  - name: SHIORI_HTTP_SECRET_KEY
    default: ""
    required: false
  - name: SHIORI_HTTP_ROOT_PATH
    default: "/"
    required: false
  - name: SHIORI_HTTP_SERVE_WEB_UI
    default: "True"
    required: false
  - name: SHIORI_DATABASE_URL
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  []
