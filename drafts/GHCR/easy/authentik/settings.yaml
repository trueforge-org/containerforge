# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/goauthentik/authentik"
ports:
  - port: 3389
    protocol: tcp
    required: false
  - port: 6636
    protocol: tcp
    required: false
  - port: 9300
    protocol: tcp
    required: false
env:
  # UNVERIFIED: the outpost server URL and token variable names are not confirmed. Add them here, with
  # required: true and no default, only after reading internal/outpost in the upstream source.
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
dependencies: []
