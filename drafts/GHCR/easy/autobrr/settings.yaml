# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/autobrr/autobrr"
ports:
  - port: 7474
    protocol: tcp
    required: true
env:
  - name: AUTOBRR__HOST
    default: "0.0.0.0"
    required: false
  - name: AUTOBRR__PORT
    default: "7474"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
