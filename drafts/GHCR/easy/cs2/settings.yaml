# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://developer.valvesoftware.com/wiki/Counter-Strike_2/Dedicated_Servers"
ports:
  - port: 27015
    protocol: udp
    required: true
  - port: 27020
    protocol: tcp
    required: false
env:
  - name: GAME_PARAMS
    default: ""
    required: false
  - name: GAME_PORT
    default: "27015"
    required: false
  - name: STEAM_USERNAME
    default: "anonymous"
    required: false
  - name: STEAM_PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: VALIDATE
    default: ""
    required: false
volumes:
  - path: /config
    required: true
