# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://rust.facepunch.com/"
# UNVERIFIED: rcon (28016/tcp) and companion (28082/tcp) ports from the draft are not in the chart and are not listed until confirmed
ports:
  - port: 28015
    protocol: udp
    required: true
env:
  - name: STEAM_APP_IDS
    default: "258550"
    required: false
  - name: STEAM_APP_VALIDATE
    default: "false"
    required: false
  - name: STEAM_USERNAME
    default: "anonymous"
    required: false
  - name: STEAM_PASSWORD
    default: ""
    required: false
  - name: GAME_PARAMS
    default: "+server.maxplayers 10"
    required: false
  - name: GAME_PORT
    default: "28015"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
