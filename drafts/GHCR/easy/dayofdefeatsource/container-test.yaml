# UNVERIFIED: timeoutSeconds is set from the first measured run (SteamCMD download plus server start)
# UDP game port 27015 has no probe here: tcp checks cannot cover it
tcp:
- port: '27015'
filePaths:
- /start.sh
- /usr/local/bin/steamcmd
- /usr/local/bin/steamcmd-base.sh
