# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/novnc/noVNC"
ports:
  - port: 6080
    protocol: tcp
    required: true
env:
  - name: REMOTE_HOST
    default: "localhost"
    required: false
  - name: REMOTE_PORT
    default: "5900"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
