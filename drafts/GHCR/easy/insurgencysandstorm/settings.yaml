# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://store.steampowered.com/app/581320/"
# UNVERIFIED: ports taken from the TrueCharts chart; not yet confirmed against the server.
ports:
  - port: 27102
    protocol: udp
    required: true
  - port: 27131
    protocol: udp
    required: false
env:
  - name: STEAM_INSTALL_DIR
    default: "/config/serverfiles"
    required: false
  - name: VALIDATE
    default: "false"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
