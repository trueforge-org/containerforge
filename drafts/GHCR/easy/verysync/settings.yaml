# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Jonnyan404/verysync"
ports:
  - port: 8886
    protocol: tcp
    required: true
  - port: 22330
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "8886"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
