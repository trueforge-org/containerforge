# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://unturned.net/"
ports:
  # Game port from the upstream unturned branch (GAME_PORT=27015, UDP). The query port is UNVERIFIED and not listed.
  - port: 27015
    protocol: udp
    required: true
env:
  - name: GAME_PORT
    default: "27015"
    required: false
  - name: GAME_PARAMS
    default: ""
    required: false
  - name: STEAM_APP_VALIDATE
    default: "false"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
