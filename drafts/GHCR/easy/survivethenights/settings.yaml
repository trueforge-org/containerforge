# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://store.steampowered.com/app/541300/"
# UNVERIFIED: ports are not confirmed. The draft's 27015/udp and 27016/udp are inferred, so none are listed yet.
ports:
  []
env:
  - name: STEAM_APP_IDS
    default: ""
    required: true
  - name: STEAM_APP_VALIDATE
    default: "false"
    required: false
  - name: STEAM_INSTALL_DIR
    default: "/config/serverfiles"
    required: false
  - name: STEAM_USERNAME
    default: "anonymous"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
