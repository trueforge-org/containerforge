# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://store.steampowered.com/app/541790"
ports:
  - port: 7777
    protocol: udp
    required: true
  - port: 27015
    protocol: udp
    required: true
env:
  - name: STEAM_APP_IDS
    default: "541790"
    required: false
  - name: STEAM_APP_VALIDATE
    default: "false"
    required: false
  - name: STEAM_USERNAME
    default: "anonymous"
    required: false
  - name: GAME_PARAMS
    default: "dow_cathedral"
    required: false
  - name: GAME_PORT
    default: "7777"
    required: false
  - name: QUERY_PORT
    default: "27015"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
