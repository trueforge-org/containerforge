# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/0xERR0R/blocky"
ports:
  - port: 4000
    protocol: tcp
    required: false
  - port: 5353
    protocol: tcp
    required: false
  - port: 5353
    protocol: udp
    required: false
env:
  - name: BLOCKY_CONFIG_FILE
    default: "/config/config.yml"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
