# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/kiwix/kiwix-tools"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: PORT
    default: "8080"
    required: false
  - name: DOWNLOAD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  []
