# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/miniflux/v2"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: LISTEN_ADDR
    default: "0.0.0.0:8080"
    required: false
  - name: DATABASE_URL
    default: ""
    required: true
  - name: RUN_MIGRATIONS
    default: "1"
    required: false
  - name: CREATE_ADMIN
    default: "0"
    required: false
  - name: ADMIN_USERNAME
    default: "admin"
    required: false
  - name: ADMIN_PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
