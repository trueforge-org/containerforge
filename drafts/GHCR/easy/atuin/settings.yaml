# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/atuinsh/atuin"
ports:
  - port: 8888
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: ATUIN_CONFIG_DIR
    default: "/config"
    required: false
  - name: RUST_LOG
    default: "atuin_server=info"
    required: false
  - name: ATUIN_PORT
    default: "8888"
    required: false
  # UNVERIFIED: ATUIN_DB_URI (required PostgreSQL URL) and the bind-address variable are read by start.sh but not yet confirmed against the atuin-server settings; add them here after verification.
volumes:
  - path: /config
    required: true
dependencies:
  - postgresql
