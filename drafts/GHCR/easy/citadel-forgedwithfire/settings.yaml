# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://store.steampowered.com/search/?term=Citadel+Forged+with+Fire"
ports:
  - port: 7777
    protocol: udp
    required: true
  - port: 27015
    protocol: udp
    required: false
env:
  - name: GAME_ID
    default: "489650"
    required: false
  - name: GAME_PARAMS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: VALIDATE
    default: "false"
    required: false
volumes:
  - path: /config
    required: true
