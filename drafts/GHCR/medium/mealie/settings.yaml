# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/mealie-recipes/mealie"
ports:
  - port: 9000
    protocol: tcp
    required: true
env:
  - name: APP_PORT
    default: "9000"
    required: false
  - name: HOST
    default: "0.0.0.0"
    required: false
  - name: BASE_URL
    default: "http://localhost:8080"
    required: false
  - name: DB_ENGINE
    default: "sqlite"
    required: false
  # UNVERIFIED: upstream defaults for the POSTGRES_* names were not confirmed, so they are left empty.
  - name: POSTGRES_SERVER
    default: ""
    required: false
  - name: POSTGRES_PORT
    default: ""
    required: false
  - name: POSTGRES_DB
    default: ""
    required: false
  - name: POSTGRES_USER
    default: ""
    required: false
  - name: POSTGRES_PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
