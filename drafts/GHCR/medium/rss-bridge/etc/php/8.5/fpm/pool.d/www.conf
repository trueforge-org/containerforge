; rootless php-fpm pool: runs as the container user (apps), no user/group switch
; UNVERIFIED: php 8.5 support by RSS-Bridge at the pinned tag

[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
clear_env = no
php_admin_value[session.save_path] = /tmp/sessions
php_admin_value[upload_tmp_dir] = /tmp
