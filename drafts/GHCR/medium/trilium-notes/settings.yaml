# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/TriliumNext/Trilium"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: TRILIUM_NETWORK_HOST
    default: "0.0.0.0"
    required: false
  - name: TRILIUM_NETWORK_PORT
    default: "8080"
    required: false
  - name: TRILIUM_GENERAL_NOBACKUP
    default: "false"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
