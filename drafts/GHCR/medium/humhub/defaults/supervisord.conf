[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 -F -y /defaults/php-fpm.conf -d post_max_size=%(ENV_PHP_POST_MAX_SIZE)s -d upload_max_filesize=%(ENV_PHP_UPLOAD_MAX_FILESIZE)s -d max_execution_time=%(ENV_PHP_MAX_EXECUTION_TIME)s -d memory_limit=%(ENV_PHP_MEMORY_LIMIT)s -d date.timezone=%(ENV_PHP_TIMEZONE)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /defaults/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
