# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/humhub/humhub"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: PHP_POST_MAX_SIZE
    default: "16M"
    required: false
  - name: PHP_UPLOAD_MAX_FILESIZE
    default: "10M"
    required: false
  - name: PHP_MAX_EXECUTION_TIME
    default: "60"
    required: false
  - name: PHP_MEMORY_LIMIT
    default: "1G"
    required: false
  - name: PHP_TIMEZONE
    default: "UTC"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: mariadb
    # the database is set up in the browser installer, so no DB env vars are listed (UNVERIFIED on a fetched page)
opt_dependencies:
  - name: valkey
