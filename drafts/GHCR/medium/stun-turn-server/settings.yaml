# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/coturn/coturn"
ports:
  - port: 3478
    protocol: tcp
    required: true
  - port: 3478
    protocol: udp
    required: true
  - port: 5349
    protocol: tcp
    required: false
env:
  - name: TURN_PORT
    default: "3478"
    required: false
  - name: TURN_TLS_PORT
    default: "5349"
    required: false
  - name: TURN_LISTEN_IP
    default: "0.0.0.0"
    required: false
  - name: TURN_REALM
    default: "example.com"
    required: false
  - name: TURN_STATIC_AUTH_SECRET
    default: ""
    required: false
  - name: TURN_EXTERNAL_IP
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
