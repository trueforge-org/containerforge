# Kanboard site: HTTP on 8080 (non-root cannot bind 80). PHP goes to php-fpm over the socket in /tmp.
# UNVERIFIED: the location rules are a plain Kanboard layout, not copied from upstream docker/ (not fetched).
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app/www;
    index index.php;
    client_max_body_size 64m;

    # Kanboard data and config are not served to clients.
    location ~ ^/(data|config\.php)(/|$) {
        deny all;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
