# ContainerForge: replaces the packaged nginx.conf so the pid and all temp paths live in /tmp (the rootfs is read-only).
# UNVERIFIED: the directives are standard nginx, but this file is not yet run against Kanboard.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
}
