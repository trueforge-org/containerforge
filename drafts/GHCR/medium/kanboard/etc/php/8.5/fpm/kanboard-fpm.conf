; ContainerForge: php-fpm pool for Kanboard. No user or group lines, because the image runs as apps.
; Socket, pid, sessions and temp files all live in /tmp (read-only rootfs).
; UNVERIFIED: the directive set is standard php-fpm, not yet run against Kanboard v1.2.58.

[global]
pid = /tmp/php/php-fpm.pid
error_log = /dev/stderr

[www]
listen = /tmp/php/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_value[session.save_path] = /tmp/php/sessions
php_admin_value[upload_tmp_dir] = /tmp/php
php_admin_value[sys_temp_dir] = /tmp/php
