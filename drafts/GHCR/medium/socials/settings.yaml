# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/diamkil/socials"
ports:
  - port: 7574
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "7574"
    required: false
  - name: DEFID
    default: "default"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
