# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Maintainerr/Maintainerr"
ports:
  - port: 6246
    protocol: tcp
    required: true
env:
  - name: UI_PORT
    default: "6246"
    required: false
  - name: UI_HOSTNAME
    default: "0.0.0.0"
    required: false
  - name: BASE_PATH
    default: ""
    required: false
  - name: DEBUG
    default: "false"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
