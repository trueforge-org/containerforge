# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/open-webui/open-webui"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "8080"
    required: false
  # Points at the separate Ollama server; upstream default is /ollama.
  - name: OLLAMA_BASE_URL
    default: "/ollama"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
