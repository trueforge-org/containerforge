# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/akhilrex/podgrab"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: CONFIG
    default: "/config"
    required: false
  - name: DATA
    default: "/config/assets"
    required: false
  - name: GIN_MODE
    default: "release"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
