# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/connorgallopo/Tracearr"
ports:
  - port: 3000
    protocol: tcp
    required: true
env:
  # DATABASE_URL and REDIS_URL are read by start.sh. The chart sets both. UNVERIFIED in the app source; confirm.
  - name: DATABASE_URL
    default: ""
    required: false
  - name: REDIS_URL
    default: ""
    required: false
  # UNVERIFIED, not listed: the chart also sets JWT_SECRET, COOKIE_SECRET, CORS_ORIGIN, LOG_LEVEL, TRUST_PROXY, MAXMIND_LICENSE_KEY. Add them after reading the upstream config schema.
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
  - name: valkey
