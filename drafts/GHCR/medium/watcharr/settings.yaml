# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/sbondCo/Watcharr"
ports:
  - port: 3080
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "3080"
    required: false
  - name: WATCHARR_DATA
    default: "/config/data"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
