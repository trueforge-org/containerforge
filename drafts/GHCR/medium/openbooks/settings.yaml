# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/evan-buss/openbooks"
ports:
  # Upstream listens on 80; 8080 is used because the runtime user cannot bind 80.
  - port: 8080
    protocol: tcp
    required: false
env:
  # UNVERIFIED: upstream Dockerfile sets BASE_PATH; remove if the server does not read it.
  - name: BASE_PATH
    default: "/"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
