# Replaces the nginx base default server: the base copies /defaults/default.conf to /config/sites/default.conf,
# so a second default_server on 8080 would clash. Serves the Homer site from /app/www.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /app/www;

    location / {
        index index.html index.htm;
    }

    # UNVERIFIED: upstream lighttpd.conf sets long-lived caching for /resources/ and no-cache elsewhere; confirm the header values.
    location /resources/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
