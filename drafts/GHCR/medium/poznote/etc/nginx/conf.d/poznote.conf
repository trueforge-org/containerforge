# UNVERIFIED: server block derived from upstream docker/nginx/default.conf (not fetched). Confirm the
# document root (/app/poznote) and the front controller before the first build. Upstream listens on 80; rootless uses 8080.
server {
    listen 8080;
    server_name _;
    root /app/poznote;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
