; UNVERIFIED: pool derived from the upstream rootless sed patches (user, group, listen.owner and listen.group removed).
; Reconcile with the upstream docker/php-fpm/www.conf at build.
[www]
listen = 127.0.0.1:9000
clear_env = no

pm = dynamic
; matches the upstream POZNOTE_PHP_FPM_MAX_CHILDREN default; no env wiring here yet
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

catch_workers_output = yes

php_admin_value[session.save_path] = /tmp/php/sessions
php_admin_value[upload_tmp_dir] = /tmp/php/uploads
php_admin_value[sys_temp_dir] = /tmp
