; UNVERIFIED: program set derived from the upstream CMD (supervisord runs nginx, php-fpm and the reminder worker).
; Binary paths below are the Ubuntu defaults and must be confirmed in the build.
[supervisord]
nodaemon = true
logfile = /tmp/supervisor/supervisord.log
pidfile = /tmp/supervisor/supervisord.pid
childlogdir = /tmp/supervisor

[program:php-fpm]
command = /usr/sbin/php-fpm8.5 -F -y /etc/php/8.5/fpm/php-fpm.conf
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; UNVERIFIED: the reminder worker program (command from upstream supervisord.conf, not fetched) is not
