# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Dictionarry-Hub/profilarr"
ports:
  - port: 6868
    protocol: tcp
    required: true
env:
  - name: AUTH
    default: "on"
    required: false
  - name: HOST
    default: "0.0.0.0"
    required: false
  - name: ORIGIN
    default: ""
    required: false
  - name: PORT
    default: "6868"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: UMASK
    default: "022"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
