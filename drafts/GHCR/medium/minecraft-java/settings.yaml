# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/itzg/docker-minecraft-server"
ports:
  - port: 25565
    protocol: tcp
    required: true
env:
  - name: TYPE
    default: "VANILLA"
    required: false
  - name: VERSION
    default: "LATEST"
    required: false
  - name: EULA
    default: ""
    required: true
  - name: MEMORY
    default: "1G"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
