# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://tt-rss.org/"
ports:
  - port: 9000
    protocol: tcp
    required: true
env:
  - name: TTRSS_DB_HOST
    default: "postgresql"
    required: false
  - name: TTRSS_DB_PORT
    default: "5432"
    required: false
  - name: TTRSS_DB_NAME
    default: "tt-rss"
    required: false
  - name: TTRSS_DB_USER
    default: "tt-rss"
    required: false
  - name: TTRSS_DB_PASS
    default: ""
    required: false
  - name: ADMIN_USER_PASS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
