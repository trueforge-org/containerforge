; php-fpm pool for tt-rss. Copied to /etc/php/8.5/fpm/pool.d/www.conf at build time.
; Values follow the upstream .docker/app pool. The process runs as the apps user, so user/group are not set.
; UNVERIFIED: php-fpm started as non-root accepts this pool without user/group; confirm in the probe run.
[www]
listen = 9000
clear_env = no
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.status_path = /status
pm.status_listen = 9001
php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /tmp/php-error.log
php_admin_flag[log_errors] = on
catch_workers_output = yes
