# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Phalcode/gamevault-backend"
ports:
  - port: 8080
    protocol: tcp
    required: true
dependencies:
  - name: postgresql
env:
  - name: SERVER_PORT
    default: "8080"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  # UNVERIFIED: DB connection env names (DB_SYSTEM, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD per chart) must be confirmed from app source before finalising
volumes:
  - path: /config
    required: true
