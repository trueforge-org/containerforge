# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Phalcode/gamevault-backend"
ports:
  - port: 8080
    protocol: tcp
    required: true
dependencies:
  - name: postgresql
env:
  - name: SERVER_PORT
    default: "8080"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: VOLUMES_FILES
    default: "/config/files"
    required: false
  - name: VOLUMES_IMAGES
    default: "/config/media"
    required: false
  - name: VOLUMES_LOG
    default: "/config/logs"
    required: false
  - name: DB_SYSTEM
    default: "POSTGRESQL"
    required: false
  - name: DB_HOST
    default: ""
    required: false
  - name: DB_PORT
    default: "5432"
    required: false
  - name: DB_DATABASE
    default: "gamevault"
    required: false
  - name: DB_USERNAME
    default: "gamevault"
    required: false
  - name: DB_PASSWORD
    default: ""
    required: false
  # UNVERIFIED: DB connection env names (DB_SYSTEM, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD per chart) must be confirmed from app source before finalising
volumes:
  - path: /config
    required: true
