# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/actualbudget/actual"
ports:
  - port: 5006
    protocol: tcp
    required: true
env:
  - name: ACTUAL_DATA_DIR
    default: "/config/data"
    required: false
  - name: ACTUAL_PORT
    default: "5006"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
