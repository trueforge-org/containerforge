# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://www.urbanterror.info/home/"
ports:
  - port: 27960
    protocol: udp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: GAME_PORT
    default: "27960"
    required: false
  - name: CONFIG_NAME
    default: "server.cfg"
    required: false
  - name: START_PARAMS
    default: ""
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
