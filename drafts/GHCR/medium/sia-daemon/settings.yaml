# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/SiaFoundation/siad"
ports:
  - port: 9980
    protocol: tcp
    required: true
  - port: 9981
    protocol: tcp
    required: false
  - port: 9982
    protocol: tcp
    required: false
  - port: 9983
    protocol: tcp
    required: false
env:
  - name: SIA_WALLET_PASSWORD
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
