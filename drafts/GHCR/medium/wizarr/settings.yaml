# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Wizarrrr/wizarr"
ports:
  - port: 5690
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "5690"
    required: false
  - name: GUNICORN_WORKERS
    default: "1"
    required: false
  - name: GUNICORN_THREADS
    default: "4"
    required: false
  - name: GUNICORN_TIMEOUT
    default: "120"
    required: false
  - name: GUNICORN_LOG_LEVEL
    default: "warning"
    required: false
  # UNVERIFIED: the docs show false as an example; the app default is not confirmed
  - name: DISABLE_BUILTIN_AUTH
    default: "false"
    required: false
  # UNVERIFIED: Wizarr's use of TZ
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
