# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/dani-garcia/vaultwarden"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: DATA_FOLDER
    default: "/config"
    required: false
  - name: ROCKET_PORT
    default: "8080"
    required: false
  - name: ROCKET_ADDRESS
    default: "0.0.0.0"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
