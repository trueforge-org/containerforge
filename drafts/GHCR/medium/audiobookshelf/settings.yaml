# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/advplyr/audiobookshelf"
ports:
  - port: 8000
    protocol: tcp
    required: true
env:
  - name: PORT
    default: "8000"
    required: false
  - name: CONFIG_PATH
    default: "/config"
    required: false
  - name: METADATA_PATH
    default: "/config/metadata"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
