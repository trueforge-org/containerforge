# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/bookorbit/bookorbit"
ports:
  - port: 3000
    protocol: tcp
    required: false
env:
  - name: PORT
    default: "3000"
    required: false
  - name: NODE_MAX_OLD_SPACE_SIZE
    default: "2048"
    required: false
  - name: POSTGRES_HOST
    default: "postgresql"
    required: false
  - name: POSTGRES_PORT
    default: "5432"
    required: false
  - name: POSTGRES_DB
    default: "bookorbit"
    required: false
  - name: POSTGRES_USER
    default: "bookorbit"
    required: false
  - name: POSTGRES_PASSWORD
    default: ""
    required: true
  - name: JWT_SECRET
    default: ""
    required: true
  - name: SETUP_BOOTSTRAP_TOKEN
    default: ""
    required: true
  - name: APP_URL
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
