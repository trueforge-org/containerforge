# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/DenDianUgerah/reubah"
ports:
  - port: 8081
    protocol: tcp
    required: true
env:
  # only PORT is documented upstream; code-level env reads are UNVERIFIED
  - name: PORT
    default: "8081"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: false
dependencies: []
