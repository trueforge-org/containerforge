# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/fredrikburmester/streamystats"
ports:
  - port: 3005
    protocol: tcp
    required: false
env:
  # UNVERIFIED: database and media server variable names must be read from upstream source; not guessed here
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
