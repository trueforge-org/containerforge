# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/gethomepage/homepage"
ports:
  - port: 3000
    protocol: tcp
    required: true
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    # upstream README: required, may need port. Chart value is localhost.
    default: "localhost"
    required: true
  - name: HOSTNAME
    default: "0.0.0.0"
    required: false
  - name: PORT
    default: "3000"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
