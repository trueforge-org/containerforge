# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/TheConnMan/docker-hub-rss"
ports:
  - port: 3000
    protocol: tcp
    required: false
env:
  # UNVERIFIED: PORT name and default come from index.js, which was not fetched
  - name: PORT
    default: "3000"
    required: false
  # optional: enables the fluent log appender when set
  - name: FLUENTD_HOST
    default: ""
    required: false
  - name: FLUENTD_TAGS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
