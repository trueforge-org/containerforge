# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ShokoAnime/ShokoServer"
ports:
  - port: 8111
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: SHOKO_HOME
    default: "/config/Shoko.CLI"
    required: false
  - name: UMASK
    default: ""
    required: false
# UNVERIFIED: whether Shoko itself reads SHOKO_HOME (only the upstream entrypoint sets it).
volumes:
  - path: /config
    required: true
dependencies: []
