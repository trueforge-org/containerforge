# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/toeverything/AFFiNE"
ports:
  - port: 3010
    protocol: tcp
    required: true
env:
  - name: POSTGRES_HOST
    default: "postgresql"
    required: false
  - name: POSTGRES_PORT
    default: "5432"
    required: false
  - name: POSTGRES_DB
    default: "affine"
    required: false
  - name: POSTGRES_USER
    default: "affine"
    required: false
  # UNVERIFIED: placeholder default follows the postgresql sibling convention; replace with a generated secret.
  - name: POSTGRES_PASSWORD
    default: "MYAFFINEPASSWORD"
    required: true
  - name: REDIS_SERVER_HOST
    default: "valkey"
    required: false
  - name: REDIS_SERVER_PORT
    default: "6379"
    required: false
  - name: NODE_ENV
    default: "production"
    required: false
  - name: PORT
    default: "3010"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: postgresql
opt_dependencies:
  - name: valkey
