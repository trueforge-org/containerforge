# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/AnalogJ/scrutiny"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
# UNVERIFIED: Scrutiny's own config env names are not confirmed; none are listed until read from the source.
volumes:
  - path: /config
    required: true
dependencies: []
