# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/HaveAGitGat/Tdarr"
ports: []
env:
  - name: serverIP
    default: "0.0.0.0" # UNVERIFIED: the TrueCharts chart sets this value. A node needs the Tdarr server address.
    required: false
  - name: serverPort
    default: "8266"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /temp
    required: false
dependencies: []
