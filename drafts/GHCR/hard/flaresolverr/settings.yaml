# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/FlareSolverr/FlareSolverr"
ports:
  - port: 8191
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
# UNVERIFIED: port 8192 (in upstream EXPOSE, purpose not stated) is not listed.
# UNVERIFIED: upstream env names (LOG_LEVEL, HEADLESS, BROWSER_TIMEOUT, ...) are not listed until read from upstream src/.
dependencies: []
