; Rootless php-fpm config for FlashPaper: pid, socket, logs and sessions are under /tmp.
; No user/group here: the process already runs as apps.

[global]
pid = /tmp/php/php-fpm.pid
error_log = /tmp/php/php-fpm.log
daemonize = yes

[flashpaper]
listen = /tmp/php/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
clear_env = no
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /tmp/php/error.log
php_admin_value[session.save_path] = /tmp/php-sessions
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
