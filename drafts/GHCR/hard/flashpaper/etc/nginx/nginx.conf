# Rootless rewrite of upstream docker/nginx.conf: listens on 8080, every pid, log and temp path is under /tmp.
pid /tmp/nginx/nginx.pid;
error_log /tmp/nginx/error.log;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Upstream sends access logs to /dev/null.
    access_log off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Same behaviour as upstream: use X-Forwarded-Proto when it is set.
    map $http_x_forwarded_proto $fwd_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 8080;
        root /app/flashpaper;
        index index.php;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            # Must match listen in etc/php/php-fpm.conf.
            fastcgi_pass unix:/tmp/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param REQUEST_SCHEME $fwd_scheme;
        }
    }
}
