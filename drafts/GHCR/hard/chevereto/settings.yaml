# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/rodber/chevereto-free"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: CHEVERETO_DB_HOST
    default: "mariadb"
    required: true
  - name: CHEVERETO_DB_PORT
    default: "3306"
    required: false
  # Placeholder defaults only. Real values must be set by the user.
  - name: CHEVERETO_DB_USER
    default: "MYMARIADBUSER"
    required: true
  - name: CHEVERETO_DB_PASS
    default: "MYMARIADBPASSWORD"
    required: true
  - name: CHEVERETO_DB_NAME
    default: "chevereto"
    required: false
  - name: CHEVERETO_HOSTNAME
    default: "localhost"
    required: false
  - name: CHEVERETO_HTTPS
    default: "1"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - name: mariadb
