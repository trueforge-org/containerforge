# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/rommapp/romm"
ports:
  - port: 10680
    protocol: tcp
    required: true
env:
  - name: ROMM_PORT
    default: "10680"
    required: false
  - name: ROMM_BASE_URL
    default: ""
    required: false
  - name: LOGLEVEL
    default: "INFO"
    required: false
  - name: ROMM_DB_DRIVER
    default: "postgresql"
    required: false
  - name: DB_HOST
    default: ""
    required: false
  - name: DB_PORT
    default: "5432"
    required: false
  - name: DB_NAME
    default: "romm"
    required: false
  - name: DB_USER
    default: "romm"
    required: false
  # No default. The app cannot reach its database without it, so it is set by the user.
  - name: DB_PASSWD
    default: ""
    required: false
  - name: REDIS_HOST
    default: ""
    required: false
  - name: REDIS_PORT
    default: "6379"
    required: false
  - name: REDIS_USERNAME
    default: "default"
    required: false
  - name: REDIS_PASSWORD
    default: ""
    required: false
  # start.sh generates this once into /config when it is empty.
  - name: ROMM_AUTH_SECRET_KEY
    default: ""
    required: false
  - name: SCAN_WORKERS
    default: "4"
    required: false
  - name: IGDB_CLIENT_ID
    default: ""
    required: false
  - name: IGDB_CLIENT_SECRET
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies:
  - postgresql
  - valkey
