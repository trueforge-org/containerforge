# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/homebridge/homebridge"
ports:
  - port: 8581
    protocol: tcp
    required: true
# UNVERIFIED: 51826/tcp (HAP) and 5353/udp (mDNS) are not listed. Add them only after a run shows them listening.
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
