# ContainerForge rootless override of the Debian apache2.conf: listens on 8080, runtime files under /tmp.
# /etc/apache2 is read-only at runtime, so this file is baked into the image.
ServerRoot "/etc/apache2"
ServerName localhost

# Runtime files go to /tmp (the rootfs is read-only). The process runs as apps, so there is no User/Group.
PidFile /tmp/apache-run/apache2.pid
Mutex file:/tmp/apache-run
DefaultRuntimeDir /tmp/apache-run
ScoreBoardFile /tmp/apache-run/apache_runtime_status

Listen 8080

# Logs to the container streams.
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %O" common
CustomLog /dev/stdout common

IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf

# UNVERIFIED: the music library path and its mount are not known. /var/www/html is a placeholder that
# serves the packaged index.html. Module directives for musicindex were not read from upstream docs.
DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html
TypesConfig /etc/mime.types

<Files ".ht*">
    Require all denied
</Files>
