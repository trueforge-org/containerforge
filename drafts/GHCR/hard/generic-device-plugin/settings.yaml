# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/squat/generic-device-plugin"
ports:
  - port: 8080 # UNVERIFIED: confirm the listen default before keeping this port
    protocol: tcp
    required: false
env:
  - name: DOMAIN
    default: "truecharts.org"
    required: false
  - name: LISTEN
    default: "0.0.0.0:8080"
    required: false
  - name: LOG_LEVEL
    default: "info"
    required: false
  - name: PLUGIN_DIR
    default: "/tmp/device-plugins"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
