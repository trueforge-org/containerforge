# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/tpill90/steam-lancache-prefill"
ports: []
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  # UNVERIFIED: SteamPrefill argument syntax; default mirrors the ich777 image (PREFILL_PARAMS_STEAM="--recent").
  - name: PREFILL_PARAMS_STEAM
    default: "--recent"
    required: false
volumes:
  - path: /config
    required: true
