# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/spesmilo/electrum"
ports:
  - port: 6080
    protocol: tcp
    required: true
env:
  - name: NOVNC_PORT
    default: "6080"
    required: false
  - name: CUSTOM_RES_W
    default: "1024"
    required: false
  - name: CUSTOM_RES_H
    default: "768"
    required: false
  - name: CUSTOM_DEPTH
    default: "16"
    required: false
  - name: DATA_DIR
    default: "/config/electrum"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
