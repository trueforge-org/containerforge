# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/aceberg/WatchYourLAN"
ports:
  - port: 8840
    protocol: tcp
    required: true
env:
  - name: PORT
    default: "8840"
    required: false
  - name: IFACES
    default: ""
    required: false
  - name: ARP_ARGS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
