# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/linkwarden/linkwarden"
ports:
  - port: 3000
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  # UNVERIFIED: database URL and auth secret names are not confirmed (plan section 6). Add them only once confirmed, as required with no default.
volumes:
  - path: /config
    required: true
dependencies:
  - postgresql
