# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/Mintplex-Labs/anything-llm"
ports:
  - port: 3001
    protocol: tcp
    required: true
env:
  - name: SERVER_PORT
    default: "3001"
    required: false
  - name: STORAGE_DIR
    default: "/config/storage"
    required: false
  # UNVERIFIED: JWT_SECRET is generated by start.sh on first start if this is empty.
  - name: JWT_SECRET
    default: ""
    required: false
  # UNVERIFIED: password policy names as set by the TrueCharts chart. Confirm the app reads them.
  - name: PASSWORDMINCHAR
    default: "8"
    required: false
  - name: PASSWORDMAXCHAR
    default: "250"
    required: false
  - name: PASSWORDLOWERCASE
    default: "1"
    required: false
  - name: PASSWORDUPPERCASE
    default: "1"
    required: false
  - name: PASSWORDNUMERIC
    default: "1"
    required: false
  - name: PASSWORDSYMBOL
    default: "1"
    required: false
  - name: PASSWORDREQUIREMENTS
    default: "4"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
