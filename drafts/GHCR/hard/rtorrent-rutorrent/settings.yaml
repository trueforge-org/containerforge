# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/rakshasa/rtorrent"
ports:
  - port: 8080
    protocol: tcp
    required: true
# UNVERIFIED: peer port 50000 is set in the rTorrent config, but it is not listed until it is confirmed (plan section 6).
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
  - path: /downloads
    required: false
dependencies: []
# Optional sidecar (rtorrent_exporter) is not in ContainerForge yet. Add it when it exists.
