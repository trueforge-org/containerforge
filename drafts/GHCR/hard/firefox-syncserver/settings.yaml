# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/mozilla-services/syncserver"
ports:
  - port: 5000
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "UTC"
    required: false
  - name: FF_SYNCSERVER_PUBLIC_URL
    default: "http://localhost:5000/"
    required: false
  - name: FF_SYNCSERVER_SQLURI
    default: "sqlite:////config/syncserver.db"
    required: false
  - name: FF_SYNCSERVER_SECRET
    default: ""
    required: false
  - name: FF_SYNCSERVER_ALLOW_NEW_USERS
    default: "true"
    required: false
  - name: FF_SYNCSERVER_FORCE_WSGI_ENVIRON
    default: "false"
    required: false
  - name: FF_SYNCSERVER_ACCESSLOG
    default: "false"
    required: false
  - name: FF_SYNCSERVER_LOGLEVEL
    default: "info"
    required: false
  - name: FF_SYNCSERVER_FORWARDED_ALLOW_IPS
    default: ""
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
