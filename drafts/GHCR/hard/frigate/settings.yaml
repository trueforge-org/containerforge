# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/blakeblackshear/frigate"
ports:
  - port: 5000
    protocol: tcp
    required: true
  - port: 8554
    protocol: tcp
    required: false
  - port: 8555
    protocol: tcp
    required: false
  - port: 8555
    protocol: udp
    required: false
# UNVERIFIED: 8971 (draft: web UI over https via nginx) is left out until confirmed in the upstream nginx config.
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
