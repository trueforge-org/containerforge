# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

# The test runs without PostgreSQL or Redis. start.sh starts nginx first and then waits
# for the database, so port 9191 is open but "/" would return 502; hence no http probe.
timeoutSeconds: 180
tcp:
- port: '9191'
filePaths:
- /app/manage.py
- /etc/dispatcharr/uwsgi.ini
- /etc/dispatcharr/site.conf
- /usr/share/licenses/dispatcharr/LICENSE
