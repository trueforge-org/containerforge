# Main nginx config for rootless, read-only-rootfs use. The upstream server block
# is derived from docker/nginx.conf at build time (/etc/dispatcharr/site.conf) and
# rendered with the listen port by start.sh into /tmp/nginx/site.conf.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include /tmp/nginx/site.conf;
}
