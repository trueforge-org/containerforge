# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/apt-mirror/apt-mirror"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: SYNC_ENABLED
    default: "false" # a full sync downloads a very large archive, so it is opt-in
    required: false
  - name: SYNC_INTERVAL
    default: "86400"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
