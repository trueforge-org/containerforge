# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/obsidianmd/obsidian-releases"
ports:
  - port: 8080
    protocol: tcp
    required: true
env:
  - name: CUSTOM_PORT
    default: "8080"
    required: false
volumes:
  - path: /config
    required: true
  - path: /vaults
    required: false
