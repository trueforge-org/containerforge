# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/ArchiveTeam/warrior-code2"
ports:
  - port: 8001
    protocol: tcp
    required: true
env:
  - name: DOWNLOADER
    default: ""
    required: false
  - name: HTTP_USERNAME
    default: ""
    required: false
  - name: HTTP_PASSWORD
    default: ""
    required: false
  - name: SELECTED_PROJECT
    default: ""
    required: false
  - name: SHARED_RSYNC_THREADS
    default: ""
    required: false
  - name: WARRIOR_ID
    default: ""
    required: false
  - name: CONCURRENT_ITEMS
    default: ""
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
