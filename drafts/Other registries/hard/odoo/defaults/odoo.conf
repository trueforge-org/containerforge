[options]
; UNVERIFIED: key names taken from the Odoo 20.0 on-premise docs only. Check against the deb before merge.
; The database connection comes from the PG* environment variables set in start.sh.
data_dir = /config/odoo-data
; UNVERIFIED: system addons path inside the odoo deb.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/config/addons
http_interface = 0.0.0.0
http_port = 8069
workers = 0
; admin_passwd is the master password for the database manager. Set it here if needed.
