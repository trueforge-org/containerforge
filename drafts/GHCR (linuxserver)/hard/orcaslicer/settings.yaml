# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/OrcaSlicer/OrcaSlicer"
# UNVERIFIED: port 3001 depends on the display stack that is not chosen yet (plan section 10).
ports:
  - port: 3001
    protocol: tcp
    required: false
env:
  # TITLE from the plan is not listed: it is read by the linuxserver Selkies base, not by OrcaSlicer.
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
