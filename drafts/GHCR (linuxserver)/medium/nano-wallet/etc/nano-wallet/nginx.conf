# Rootless nginx config for nano-wallet (runs as apps, read-only rootfs).
# Upstream linuxserver config is not used: its site file (root/default) was not fetched, so the server block here is written from the plan.
# UNVERIFIED: the server block and SPA fallback must be checked on the first run.

pid /tmp/nginx/nginx.pid;
worker_processes 4;
daemon off;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr;

    gzip on;
    gzip_disable "msie6";

    server {
        listen 8080;
        server_name _;

        root /app/nano-wallet;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
