; Supervises php-fpm and nginx for photoshow (rootless, read-only /app and /etc).
; php-fpm pool config is generated by start.sh in /tmp/photoshow/php-fpm.conf.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/photoshow/supervisord.pid

[program:php-fpm]
command=/usr/local/bin/php-fpm -F -y /tmp/photoshow/php-fpm.conf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -c /etc/photoshow/nginx.conf -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
