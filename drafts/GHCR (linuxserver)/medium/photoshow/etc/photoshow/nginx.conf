# Rootless nginx config for photoshow (runs as apps, read-only /app).
# UNVERIFIED: written from the plan and the linuxserver site file; check the server block on the first run.

pid /tmp/photoshow/nginx.pid;
worker_processes auto;
daemon off;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/photoshow/client_body;
    proxy_temp_path /tmp/photoshow/proxy;
    fastcgi_temp_path /tmp/photoshow/fastcgi;
    uwsgi_temp_path /tmp/photoshow/uwsgi;
    scgi_temp_path /tmp/photoshow/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    server {
        listen 8080;
        server_name _;

        root /app/photoshow;
        index index.php;

        client_max_body_size 0;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
