# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/hexchat/hexchat"
ports:
  - port: 6080
    protocol: tcp
    required: true
env:
  # start.sh refuses to start without it, so the desktop is never exposed without auth.
  - name: VNC_PASSWORD
    default: ""
    required: true
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
dependencies: []
