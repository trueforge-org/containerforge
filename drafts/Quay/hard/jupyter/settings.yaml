# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/jupyter/docker-stacks"
ports:
  - port: 8888
    protocol: tcp
    required: true
env:
  - name: JUPYTER_PORT
    default: "8888"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
