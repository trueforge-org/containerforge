# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json

# CONFLICT (open): the test runs with no env, so start.sh exits 1 without MINIO_ROOT_PASSWORD and
# the probes below fail. Decide with the user how the test passes the password (UNVERIFIED that the
