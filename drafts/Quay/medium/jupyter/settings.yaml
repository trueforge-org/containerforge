# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/jupyter/notebook"
ports:
  - port: 8888
    protocol: tcp
    required: true
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
  - name: UMASK
    default: "002"
    required: false
  # UNVERIFIED: JUPYTER_TOKEN is read by jupyter_server for the pinned version; confirm on first run
  - name: JUPYTER_TOKEN
    default: ""
    required: false
volumes:
  - path: /config
    required: true
