# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/pkg/containers/test/container-test.schema.json


runners:
- entrypoint: test -f /usr/local/bin/python3
# forgetool splits cmd on whitespace (no shell quoting), so keep the code space-free;
# build the expected string at runtime so a traceback echoing the source can't match
- entrypoint: python3
  cmd: "-c __import__('compression.zstd');print('zstd'+'-ok')"
  expectedOutput: zstd-ok
