# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/trueforge-org/dexafix"
ports:
  - port: 8080
    protocol: tcp
    required: false
env:
  - name: DEXAFIX_LISTEN
    default: ":8080"
    required: false
  - name: DEXAFIX_INTERNAL_LISTEN
    default: ":8081"
    required: false
  - name: DEXAFIX_DSN
    default: "file:/config/dexafix.db"
    required: false
  - name: DEXAFIX_ENCRYPTION_KEY_FILE
    default: "/config/dexafix.key"
    required: false
volumes:
  - path: /config
    required: true
opt_dependencies:
  - name: postgresql
  - name: valkey
