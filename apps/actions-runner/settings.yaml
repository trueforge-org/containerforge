# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/actions/runner"
ports:
  []
env:
  # The variables below are only read by /scripts/standalone.sh (docker compose mode).
  # Kubernetes / ARC passes its own command and does not use them.
  - name: RUNNER_DIND
    default: "auto"
    required: false
  - name: RUNNER_DISABLE_UPDATE
    default: "false"
    required: false
  - name: RUNNER_EPHEMERAL
    default: "false"
    required: false
  - name: RUNNER_GROUP
    default: ""
    required: false
  - name: RUNNER_LABELS
    default: ""
    required: false
  - name: RUNNER_NAME
    default: ""
    required: false
  - name: RUNNER_REMOVE_ON_EXIT
    default: "false"
    required: false
  - name: RUNNER_REPOSITORY_URL
    default: ""
    required: false
  - name: RUNNER_TOKEN
    default: ""
    required: false
  - name: RUNNER_WORKDIR
    default: "/tmp/runner/work"
    required: false
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /config
    required: true
