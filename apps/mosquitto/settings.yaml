# yaml-language-server: $schema=https://raw.githubusercontent.com/trueforge-org/forgetool/refs/heads/main/schemas/container-settings.schema.json
schema_version: 1
upstream_env_url: "https://github.com/eclipse-mosquitto/mosquitto"
ports:
  - port: 1883
    protocol: tcp
    required: false
env:
  - name: TZ
    default: "Etc/UTC"
    required: false
volumes:
  - path: /mosquitto/config
    required: false
  - path: /mosquitto/configinc
    required: false
  - path: /mosquitto/data
    required: false
