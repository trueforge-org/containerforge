---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Tests
description: Takes an app and an app image, then runs the app tests with a pinned forgetool

inputs:
  app:
    description: App Name
    required: true
  image:
    description: Image
    required: true
  version:
    description: App version, exported to the tests as VERSION
    required: true

runs:
  using: composite
  steps:
    - name: Setup Forgetool
      uses: ./.github/actions/setup-forgetool

    - name: Run Tests
      shell: bash
      env:
        APP: ${{ inputs.app }}
        TEST_IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        TESTHELPERS_CONTAINER_LOGS: all
      run: |-
        set -o pipefail
        mkdir -p "${RUNNER_TEMP}/test-logs"
        forgetool containers test --image "${TEST_IMAGE}" --config "./apps/${APP}/container-test.yaml" 2>&1 | tee "${RUNNER_TEMP}/test-logs/${APP}.log"
