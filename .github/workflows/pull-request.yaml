---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pull Request

on:
  merge_group:
  pull_request:

jobs:
  prepare:
    name: Prepare
    timeout-minutes: 10
    runs-on:
      group: default
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false

      - name: Get changed files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        id: changed-files
        with:
          path: apps
          include_only_directories: true
          max_depth: 1

      - name: Select apps to build
        id: apps
        env:
          CHANGED: ${{ steps.changed-files.outputs.changed_files }}
          TITLE: ${{ github.event.pull_request.title }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |-
          # Base-image bumps touch every dependent app. Building all of them would overload the runners,
          # so build a smoke set instead: a fixed set per base plus two rotating dependents.
          base=""
          case "${TITLE}" in
            "chore(ubuntu-dep): update ghcr.io/trueforge-org/ubuntu"*) base=ubuntu; fixed="jackett mariadb snipe-it" ;;
            "chore(python-dep): update ghcr.io/trueforge-org/python"*) base=python; fixed="apprise-api go-yq" ;;
          esac
          if [[ -z "${base}" ]]; then
            echo "apps=${CHANGED}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mapfile -t candidates < <(jq -r '.[]' <<< "${CHANGED}" | while read -r app; do
            grep -q "^FROM ghcr.io/trueforge-org/${base}[:@]" "apps/${app}/Dockerfile" 2>/dev/null && echo "${app}"
          done | sort)
          selected=()
          rotating=()
          for app in "${candidates[@]}"; do
            if [[ " ${fixed} " == *" ${app} "* ]]; then selected+=("${app}"); else rotating+=("${app}"); fi
          done
          n=${#rotating[@]}
          if (( n > 0 )); then
            selected+=("${rotating[$((RUN_NUMBER % n))]}")
            (( n > 1 )) && selected+=("${rotating[$(((RUN_NUMBER + n / 2) % n))]}")
          fi
          apps="$(printf '%s\n' "${selected[@]}" | sort -u | jq -R . | jq -sc .)"
          echo "Smoke set for ${base} bump: ${apps}"
          echo "apps=${apps}" >> "${GITHUB_OUTPUT}"

  build:
    if: ${{ needs.prepare.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - prepare
    uses: ./.github/workflows/app-builder.yaml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
      fail-fast: false
      max-parallel: 8
    with:
      app: ${{ matrix.app }}
      release: false

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - build
    timeout-minutes: 5
    runs-on:
      group: default
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |-
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: |-
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
